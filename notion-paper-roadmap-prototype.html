      function automaticNodeOrder(left, right, domainOrder) {
        const rank = (node) => Math.min(...(node.domains || []).map((id) => domainOrder.get(id) ?? 999));
        return rank(left) - rank(right)
          || String(left.title || '').localeCompare(String(right.title || ''), 'ko')
          || String(left.id).localeCompare(String(right.id));
      }

      function applyAutomaticLayout(nodes, edges, domainId, domainOrder) {
        const visible = nodes.filter((node) => domainId === 'all' || node.domains.includes(domainId));
        if (!visible.length) return;
        const nodeById = new Map(visible.map((node) => [node.id, node]));
        const incoming = new Map(visible.map((node) => [node.id, []]));
        const outgoing = new Map(visible.map((node) => [node.id, []]));
        edges
          .filter((edge) => nodeById.has(edge.source) && nodeById.has(edge.target) && edge.source !== edge.target)
          .sort((left, right) => String(left.id).localeCompare(String(right.id)))
          .forEach((edge) => {
            outgoing.get(edge.source).push(edge.target);
            incoming.get(edge.target).push(edge.source);
          });

        const compareIds = (leftId, rightId) => automaticNodeOrder(nodeById.get(leftId), nodeById.get(rightId), domainOrder);
        const remainingIncoming = new Map([...incoming].map(([id, sources]) => [id, sources.length]));
        const layer = new Map(visible.map((node) => [node.id, 0]));
        const queue = visible.filter((node) => remainingIncoming.get(node.id) === 0).map((node) => node.id).sort(compareIds);
        const ordered = [];
        while (queue.length) {
          const id = queue.shift();
          ordered.push(id);
          [...outgoing.get(id)].sort(compareIds).forEach((targetId) => {
            layer.set(targetId, Math.max(layer.get(targetId), layer.get(id) + 1));
            remainingIncoming.set(targetId, remainingIncoming.get(targetId) - 1);
            if (remainingIncoming.get(targetId) === 0) {
              queue.push(targetId);
              queue.sort(compareIds);
            }
          });
        }

        const unresolved = visible.map((node) => node.id).filter((id) => !ordered.includes(id)).sort(compareIds);
        unresolved.forEach((id) => {
          const resolvedPredecessors = incoming.get(id).filter((sourceId) => ordered.includes(sourceId));
          if (resolvedPredecessors.length) layer.set(id, Math.max(...resolvedPredecessors.map((sourceId) => layer.get(sourceId) + 1)));
          ordered.push(id);
        });

        const byLayer = new Map();
        ordered.forEach((id) => {
          const value = layer.get(id);
          if (!byLayer.has(value)) byLayer.set(value, []);
          byLayer.get(value).push(id);
        });
        const lane = new Map();
        let nextRootLane = 0;
        let maxLane = 0;
        [...byLayer.keys()].sort((left, right) => left - right).forEach((layerIndex) => {
          const records = byLayer.get(layerIndex).map((id) => {
            const predecessorLanes = incoming.get(id).map((sourceId) => lane.get(sourceId)).filter(Number.isFinite);
            return { id, desiredLane: predecessorLanes.length ? Math.max(...predecessorLanes) : nextRootLane++ };
          }).sort((left, right) => left.desiredLane - right.desiredLane || compareIds(left.id, right.id));
          const used = new Set();
          records.forEach((record) => {
            let value = record.desiredLane;
            while (used.has(value)) value += 1;
            used.add(value);
            lane.set(record.id, value);
            maxLane = Math.max(maxLane, value);
          });
        });

        const maxLayer = Math.max(0, ...layer.values());
        const columnStep = maxLayer ? Math.min(355, (WORLD_W - NODE_W - AUTO_LAYOUT_PADDING_X * 2) / maxLayer) : 0;
        const layoutWidth = NODE_W + columnStep * maxLayer;
        const startX = Math.round((WORLD_W - layoutWidth) / 2);
        const laneCount = maxLane + 1;
        const rowStep = laneCount > 1 ? Math.min(320, (WORLD_H - NODE_H - AUTO_LAYOUT_PADDING_Y * 2) / (laneCount - 1)) : 0;
        const layoutHeight = NODE_H + rowStep * Math.max(0, laneCount - 1);
        const startY = Math.round((WORLD_H - layoutHeight) / 2);

        visible.forEach((node) => {
          node.positions ||= {};
          if (node.positions[domainId]) return;
          node.positions[domainId] = {
            x: Math.round(startX + layer.get(node.id) * columnStep),
            y: Math.round(startY + lane.get(node.id) * rowStep)
          };
        });
      }

      function applyAutomaticLayouts(nodes, edges, domains) {
        const domainOrder = new Map(domains.map((domain, index) => [domain.id, index]));
        domains.forEach((domain) => applyAutomaticLayout(nodes, edges, domain.id, domainOrder));
      }

      function mergeRemoteSnapshot(snapshot) {
        if (!Array.isArray(snapshot?.nodes) || !Array.isArray(snapshot?.edges) || !Array.isArray(snapshot?.domains)) {
          throw new Error('올바르지 않은 로드맵 응답');
        }
        const firstRemoteSync = !notionSyncEnabled;
        const nodes = snapshot.nodes.map((node) => ({
          ...node,
          domains: Array.isArray(node.domains) && node.domains.length ? node.domains : [node.domain],
          positions: node.positions && Object.keys(node.positions).length ? node.positions : {}
        }));
        normalizeNodePapers(nodes);
        const edges = snapshot.edges.map((edge) => ({
          ...edge,
          portalPositions: edge.portalPositions && Object.keys(edge.portalPositions).length ? edge.portalPositions : {}
        }));
        const domains = normalizeDomains(snapshot.domains, nodes, false);
        applyAutomaticLayouts(nodes, edges, domains);
        state = {
          ...state,
          domains,
          nodes,
          edges,
          syncedAt: snapshot.updatedAt || new Date().toISOString()
        };
        notionDatabaseUrl = safeNotionPageUrl(snapshot.databaseUrl) || notionDatabaseUrl;
        notionSyncEnabled = true;
        showCandidates = Boolean(snapshot.includeCandidates);
        updateCandidateToggle();
        if (!state.domains.some((domain) => domain.id === currentDomain)) currentDomain = 'all';
        if (selectedId && !nodes.some((node) => node.id === selectedId)) {
          selectedId = null;
          inspectorOpen = false;
        }
        saveState(`Notion 동기화됨 · ${new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}`);
        setRemoteModeUi();
        populateForms();
        render();
        if (firstRemoteSync) requestAnimationFrame(() => fitVisible(false));
      }

      async function syncFromNotion({ silent = false, force = false } = {}) {
        if (!ROADMAP_API_URL) return false;
        if (notionSyncInFlight) return notionSyncInFlight;
        notionSyncInFlight = (async () => {
          try {
            const requestUrl = new URL(ROADMAP_API_URL);
            const headers = { Accept: 'application/json' };
            if (showCandidates) {
              const writeKey = await getWriteKey();
              if (!writeKey) {
                showCandidates = false;
                updateCandidateToggle();
              } else {
                requestUrl.searchParams.set('includeCandidates', '1');
                headers['x-roadmap-write-key'] = writeKey;
              }
            }
            if (force) requestUrl.searchParams.set('_refresh', Date.now());
            const response = await fetch(requestUrl, { headers, cache: 'no-store' });
            if (response.status === 401 && showCandidates) {
              sessionStorage.removeItem('roadmap-write-key');
              showCandidates = false;
              updateCandidateToggle();
            }
            if (!response.ok) throw new Error(`동기화 응답 ${response.status}`);
            mergeRemoteSnapshot(await response.json());
            if (!silent) showToast('Notion의 최신 논문을 불러왔습니다');
            return true;
          } catch (error) {
            $('saveText').textContent = notionSyncEnabled ? '마지막 Notion 데이터 표시 중' : '로컬 데이터 · Notion 연결 대기';
            if (!silent) showToast('Notion 연결을 확인해주세요');
            console.warn('Notion roadmap sync unavailable', error);
            return false;
          } finally {
            notionSyncInFlight = null;
          }
        })();
        return notionSyncInFlight;
      }

      function openNotionLibrary() {
        if (!notionDatabaseUrl) {
          showToast('Notion 논문 아틀라스 주소를 서버에 설정해주세요');
          return;
        }
        window.open(notionDatabaseUrl, '_blank', 'noopener,noreferrer');
        showToast('Notion 논문 아틀라스를 열었습니다');
      }

      function notionColorName(hex) {
        return ({
          '#315d80': 'blue', '#b96d32': 'orange', '#64724c': 'green', '#8d4554': 'red',
          '#6f5b8f': 'purple', '#3f7d6b': 'green', '#a65d42': 'orange', '#4f6f9a': 'blue',
          '#86684b': 'brown', '#7a5269': 'pink'
        })[String(hex || '').toLowerCase()] || 'purple';
      }

      async function getWriteKey() {
        let writeKey = sessionStorage.getItem('roadmap-write-key') || '';
        if (!writeKey) {
          writeKey = String(prompt('팀에 공유된 로드맵 편집 키를 입력해주세요.') || '').trim();
          if (!writeKey) return '';
          sessionStorage.setItem('roadmap-write-key', writeKey);
        }
        return writeKey;
      }

      async function authorizedRequest(url, { method = 'POST', body } = {}, failureMessage) {
        const writeKey = await getWriteKey();
        if (!writeKey) return { ok: false, status: 0, data: null };
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'x-roadmap-write-key': writeKey },
          body: body === undefined ? undefined : JSON.stringify(body)
        });
        if (response.status === 401) sessionStorage.removeItem('roadmap-write-key');
        const data = await response.json().catch(() => null);
        if (!response.ok) {
          showToast(response.status === 401 ? '편집 키가 맞지 않습니다' : failureMessage);
          return { ok: false, status: response.status, data };
        }
        sessionStorage.setItem('roadmap-write-key', writeKey);
        return { ok: true, status: response.status, data };
      }

      async function addRemoteDomain(formData) {
        const result = await authorizedRequest(DOMAIN_API_URL, { body: {
          name: String(formData.get('name') || '').trim(),
          color: notionColorName(formData.get('color'))
        } }, 'Notion 분야를 추가하지 못했습니다');
        if (!result.ok) return null;
        const { domain } = result.data;
        if (!state.domains.some((item) => item.id === domain.id)) state.domains.push(domain);
        state.viewports[domain.id] ||= { x: 55, y: 28, scale: .86 };
        saveState('Notion에 새 분야 저장됨');
        renderTabs();
        showToast(`${domain.name} 분야를 Notion에 추가했습니다`);
        return domain;
      }

      function selectedValues(select) {
        return Array.from(select?.selectedOptions || []).map((option) => option.value).filter(Boolean);
      }

      async function loadPaperOptions() {
        if (!notionSyncEnabled || !PAPER_API_URL) return availablePapers;
        const result = await authorizedRequest(PAPER_API_URL, { method: 'GET' }, '논문 목록을 불러오지 못했습니다');
        if (result.ok) availablePapers = Array.isArray(result.data?.papers) ? result.data.papers : [];
        populatePaperOptions();
        return availablePapers;
      }

      function populatePaperOptions() {
        const options = availablePapers.map((paper) => `<option value="${escapeHtml(paper.id)}">${escapeHtml(paper.title)}${paper.status === '후보' ? ' · 후보' : ''}</option>`).join('');
        $('nodePapers').innerHTML = options || '<option value="" disabled>등록된 논문이 없습니다</option>';
        $('edgePapers').innerHTML = options || '<option value="" disabled>등록된 논문이 없습니다</option>';
      }

      async function previewConceptMatches() {
        if (!notionSyncEnabled || !CONCEPT_MATCH_API_URL) return null;
        const title = $('nodeTitle').value.trim();
        if (!title) return null;
        const requestUrl = new URL(CONCEPT_MATCH_API_URL);
        requestUrl.searchParams.set('title', title);
        requestUrl.searchParams.set('aliases', $('nodeAliases').value.trim());
        requestUrl.searchParams.set('summary', $('nodeSummary').value.trim());
        const result = await authorizedRequest(requestUrl, { method: 'GET' }, '기존 개념 검색에 실패했습니다');
        const preview = $('conceptMatchPreview');
        if (!result.ok) {
          preview.classList.remove('visible');
          return null;
        }
        const matches = result.data?.matches || [];
        if (!matches.length || matches[0].score < .45) {
          preview.textContent = '가까운 기존 개념을 찾지 못했습니다. 저장 시 한 번 더 검사합니다.';
        } else {
          preview.innerHTML = `<strong>기존 개념 후보</strong><br>${matches.slice(0, 3).map((match) => `${escapeHtml(match.title)} · ${Math.round(match.score * 100)}%${match.exact ? ' · 동일 이름/별칭' : ''}`).join('<br>')}`;
        }
        preview.classList.add('visible');
        return result.data;
      }

      async function addRemoteNode(formData) {
        const primaryDomain = domainById(String(formData.get('domain') || ''));
        const additional = selectedValues($('nodeAdditionalDomains')).map((id) => domainById(id).name);
        const domains = [...new Set([primaryDomain.name, ...additional])].filter((name) => name && name !== '전체');
        const title = String(formData.get('title') || '').trim();
        const aliases = String(formData.get('aliases') || '').split(',').map((value) => value.trim()).filter(Boolean);
        const result = await authorizedRequest(CONCEPT_API_URL, { body: {
          title,
          aliases,
          domains,
          summary: String(formData.get('summary') || '').trim(),
          paperIds: selectedValues($('nodePapers'))
        } }, 'Notion에 후보 개념을 추가하지 못했습니다');
        if (!result.ok) {
          if (result.status === 409) {
            const closest = result.data?.duplicate || result.data?.matches?.[0];
            const reason = result.data?.error === 'CONCEPT_DUPLICATE' ? '이미 같은 개념이 있습니다' : '유사 개념을 먼저 확인해주세요';
            $('conceptMatchPreview').innerHTML = `<strong>${reason}</strong>${closest ? `<br>${escapeHtml(closest.title)} · ${Math.round((closest.score || 1) * 100)}%` : ''}`;
            $('conceptMatchPreview').classList.add('visible');
          }
          return false;
        }
        await syncFromNotion({ silent: true, force: true });
        const created = state.nodes.find((node) => node.id === result.data?.concept?.id);
        if (created) {
          selectedId = created.id;
          inspectorOpen = true;
          render();
          focusNode(created.id);
        }
        showToast(showCandidates ? '후보 개념을 Notion과 로드맵에 추가했습니다' : '후보 개념을 Notion에 저장했습니다 · 후보 포함에서 확인');
        return true;
      }

      async function addRemoteEdge(formData) {
        const source = nodeById(String(formData.get('source') || ''));
        const target = nodeById(String(formData.get('target') || ''));
        if (!source || !target) return false;
        const result = await authorizedRequest(RELATION_API_URL, { body: {
          sourceConceptId: source.id,
          targetConceptId: target.id,
          type: String(formData.get('type') || ''),
          evidencePaperIds: selectedValues($('edgePapers')),
          summary: String(formData.get('summary') || '').trim()
        } }, 'Notion 관계를 추가하지 못했습니다');
        if (!result.ok) return false;
        await syncFromNotion({ silent: true, force: true });
        showToast(result.data?.relation?.reused ? '기존 관계에 근거 논문을 추가했습니다' : '후보 관계를 Notion에 추가했습니다');
        return true;
      }

      async function saveRemoteLayout(kind, pageId, layout) {
        if (!notionSyncEnabled || !LAYOUT_API_URL) return false;
        try {
          const result = await authorizedRequest(LAYOUT_API_URL, { method: 'PATCH', body: { kind, pageId, layout } }, '공유 위치를 저장하지 못했습니다');
          if (result.ok) $('saveText').textContent = 'Notion에 공유 위치 저장됨';
          return result.ok;
        } catch (_) {
          showToast('공유 위치를 저장하지 못했습니다');
          return false;
        }
      }

      function queueRemoteLayout(kind, pageId, layout) {
        const savedLayout = JSON.parse(JSON.stringify(layout || {}));
        const save = () => saveRemoteLayout(kind, pageId, savedLayout);
        const queued = layoutSaveQueue.then(save, save);
        layoutSaveQueue = queued.catch(() => false);
        return queued;
      }

      function updateCandidateToggle() {
        const button = $('candidateToggleBtn');
        button.textContent = showCandidates ? '후보 표시 중' : '후보 포함';
        button.classList.toggle('active', showCandidates);
        button.setAttribute('aria-pressed', String(showCandidates));
      }

      function domainById(id) { return state.domains.find((d) => d.id === id) || state.domains[0]; }
      function nodeById(id) { return state.nodes.find((n) => n.id === id); }
      function domainColor(id) { return domainById(id).color; }
      function nodeDisplayDomain(node) {
        if (currentDomain !== 'all' && node?.domains?.includes(currentDomain)) return currentDomain;
        return node?.domain || node?.domains?.[0] || 'all';
      }
      function sharesDomain(left, right) {
        return (left?.domains || [left?.domain]).some((id) => (right?.domains || [right?.domain]).includes(id));
      }
      function isVisible(node) { return currentDomain === 'all' || node.domains.includes(currentDomain); }
      function visibleNodes() { return state.nodes.filter(isVisible); }

      function ensurePosition(node, domain = currentDomain) {
        node.positions ||= {};
        const key = domain === 'all' ? 'all' : domain;
        if (!node.positions[key]) {
          const candidates = domain === 'all' ? state.nodes : state.nodes.filter((n) => n.domains.includes(domain));
          const index = candidates.indexOf(node);
          node.positions[key] = {
            x: 170 + (Math.max(index, 0) % 3) * 355,
            y: 170 + Math.floor(Math.max(index, 0) / 3) * 210
          };
        }
        return node.positions[key];
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
      }

      function typeLabel(type) {
        return ({ prerequisite: '선수', extends: '확장', enables: '가능하게 함', applies_to: '응용', contrasts_with: '대조' })[type] || type;
      }

      function hidePortalTooltip(owner) {
        if (owner && portalTooltipOwner !== owner) return;
        portalTooltipOwner = null;
        portalTooltip.classList.remove('visible', 'below');
        portalTooltip.setAttribute('aria-hidden', 'true');
      }

      function showPortalTooltip(button) {
        const text = button.dataset.tooltip;
        if (!text) return;
        portalTooltipOwner = button;
        portalTooltip.textContent = text;
        portalTooltip.classList.remove('visible', 'below');

        const hostRect = canvasWrap.getBoundingClientRect();
        const buttonRect = button.getBoundingClientRect();
        const tooltipRect = portalTooltip.getBoundingClientRect();
        const halfWidth = tooltipRect.width / 2;
        const centerX = clamp(buttonRect.left - hostRect.left + buttonRect.width / 2, halfWidth + 10, hostRect.width - halfWidth - 10);
        let top = buttonRect.top - hostRect.top - tooltipRect.height - 10;
        if (top < 8) {
          top = buttonRect.bottom - hostRect.top + 10;
          portalTooltip.classList.add('below');
        }
        portalTooltip.style.left = `${centerX}px`;
        portalTooltip.style.top = `${top}px`;
        portalTooltip.setAttribute('aria-hidden', 'false');
        portalTooltip.classList.add('visible');
      }

      function applyViewport() {
        world.style.transform = `translate(${viewport.x}px, ${viewport.y}px) scale(${viewport.scale})`;
        $('zoomReadout').textContent = `${Math.round(viewport.scale * 100)}%`;
      }

      function isHorizontalSide(side) {
        return side === 'left' || side === 'right';
      }

      function connectionSides(sourcePos, targetPos, edgeId) {
        const sourceCenter = { x: sourcePos.x + NODE_W / 2, y: sourcePos.y + NODE_H / 2 };
        const targetCenter = { x: targetPos.x + NODE_W / 2, y: targetPos.y + NODE_H / 2 };
        const dx = targetCenter.x - sourceCenter.x;
        const dy = targetCenter.y - sourceCenter.y;
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);
        const previousAxis = edgeAxisCache.get(edgeId);
        let axis;
        if (previousAxis === 'vertical') axis = absY >= absX * .84 ? 'vertical' : 'horizontal';
        else if (previousAxis === 'horizontal') axis = absY > absX * 1.16 ? 'vertical' : 'horizontal';
        else axis = absY > absX ? 'vertical' : 'horizontal';
        edgeAxisCache.set(edgeId, axis);

        if (axis === 'vertical') {
          return dy >= 0
            ? { axis, sourceSide: 'bottom', targetSide: 'top' }
            : { axis, sourceSide: 'top', targetSide: 'bottom' };
        }
        return dx >= 0
          ? { axis, sourceSide: 'right', targetSide: 'left' }
          : { axis, sourceSide: 'left', targetSide: 'right' };
      }

      function nodePort(pos, side, role, slot = 0, count = 1) {
        const spread = (slot - (count - 1) / 2) * 13;
        const roleOffset = role === 'source' ? PORT_ROLE_OFFSET : -PORT_ROLE_OFFSET;
        if (isHorizontalSide(side)) {
          const y = clamp(pos.y + NODE_H / 2 + roleOffset + spread, pos.y + 18, pos.y + NODE_H - 18);
          return { x: side === 'right' ? pos.x + NODE_W : pos.x, y, side };
        }
        const x = clamp(pos.x + NODE_W / 2 + roleOffset + spread, pos.x + 24, pos.x + NODE_W - 24);
        return { x, y: side === 'bottom' ? pos.y + NODE_H : pos.y, side };
      }

      function orthogonalPath(start, end, lane = 0) {
        const leadPoint = (point) => {
          if (point.side === 'right') return { x: point.x + 34, y: point.y };
          if (point.side === 'left') return { x: point.x - 34, y: point.y };
          if (point.side === 'bottom') return { x: point.x, y: point.y + 34 };
          return { x: point.x, y: point.y - 34 };
        };
        const startLead = leadPoint(start);
        const endLead = leadPoint(end);
        const startHorizontal = isHorizontalSide(start.side);
        const endHorizontal = isHorizontalSide(end.side);
        let points;
        let labelX;
        let labelY;

        if (startHorizontal && endHorizontal) {
          const facing = (start.side === 'right' && end.side === 'left' && start.x <= end.x)
            || (start.side === 'left' && end.side === 'right' && start.x >= end.x);
          const bendX = facing
            ? (startLead.x + endLead.x) / 2 + lane
            : (start.side === 'right' ? Math.max(start.x, end.x) + 54 + lane : Math.min(start.x, end.x) - 54 - lane);
          points = [start, { x: bendX, y: start.y }, { x: bendX, y: end.y }, end];
          labelX = bendX;
          labelY = (start.y + end.y) / 2 - 7;
        } else if (!startHorizontal && !endHorizontal) {
          const facing = (start.side === 'bottom' && end.side === 'top' && start.y <= end.y)
            || (start.side === 'top' && end.side === 'bottom' && start.y >= end.y);
          const bendY = facing
            ? (startLead.y + endLead.y) / 2 + lane
            : (start.side === 'bottom' ? Math.max(start.y, end.y) + 54 + lane : Math.min(start.y, end.y) - 54 - lane);
          points = [start, { x: start.x, y: bendY }, { x: end.x, y: bendY }, end];
          labelX = (start.x + end.x) / 2;
          labelY = bendY - 7;
        } else {
          const corner = startHorizontal
            ? { x: endLead.x, y: startLead.y }
            : { x: startLead.x, y: endLead.y };
          points = [start, startLead, corner, endLead, end];
          labelX = corner.x;
          labelY = corner.y - 7;
        }

        const compactPoints = points.filter((point, index) => index === 0 || point.x !== points[index - 1].x || point.y !== points[index - 1].y);
        return {
          d: compactPoints.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x} ${point.y}`).join(' '),
          labelX,
          labelY,
          start,
          end
        };
      }

      function buildInternalRoutes() {
        const records = state.edges.flatMap((edge, order) => {
          const source = nodeById(edge.source);
          const target = nodeById(edge.target);
          if (!source || !target || !isVisible(source) || !isVisible(target)) return [];
          const sourcePos = ensurePosition(source);
          const targetPos = ensurePosition(target);
          const sides = connectionSides(sourcePos, targetPos, edge.id);
          return [{
            edge,
            order,
            sourcePos,
            targetPos,
            axis: sides.axis,
            sourceSide: sides.sourceSide,
            targetSide: sides.targetSide,
            sourceSlot: 0,
            sourceCount: 1,
            targetSlot: 0,
            targetCount: 1
          }];
        });
        const groups = new Map();
        const addToGroup = (key, record, role, otherY) => {
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push({ record, role, otherY });
        };
        records.forEach((record) => {
          const sourceOtherCoordinate = isHorizontalSide(record.sourceSide) ? record.targetPos.y + NODE_H / 2 : record.targetPos.x + NODE_W / 2;
          const targetOtherCoordinate = isHorizontalSide(record.targetSide) ? record.sourcePos.y + NODE_H / 2 : record.sourcePos.x + NODE_W / 2;
          addToGroup(`${record.edge.source}:${record.sourceSide}:source`, record, 'source', sourceOtherCoordinate);
          addToGroup(`${record.edge.target}:${record.targetSide}:target`, record, 'target', targetOtherCoordinate);
        });
        groups.forEach((items) => {
          items.sort((a, b) => a.otherY - b.otherY || a.record.order - b.record.order);
          items.forEach((item, index) => {
            item.record[`${item.role}Slot`] = index;
            item.record[`${item.role}Count`] = items.length;
          });
        });
        return new Map(records.map((record) => [record.edge.id, record]));
      }

      function edgePath(route) {
        const sourcePort = nodePort(route.sourcePos, route.sourceSide, 'source', route.sourceSlot, route.sourceCount);
        const targetPort = nodePort(route.targetPos, route.targetSide, 'target', route.targetSlot, route.targetCount);
        const lane = ((route.order % 3) - 1) * 7;
        return orthogonalPath(sourcePort, targetPort, lane);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function portalCollides(candidate, occupied) {
        return occupied.some((rect) => {
          const clearance = rect.kind === 'node' ? 28 : 14;
          return candidate.x < rect.x + rect.width + clearance
            && candidate.x + PORTAL_W + clearance > rect.x
            && candidate.y < rect.y + rect.height + clearance
            && candidate.y + PORTAL_H + clearance > rect.y;
        });
      }

      function autoPortalPosition(visibleNode, incoming, slot, occupied) {
        const pos = ensurePosition(visibleNode);
        const nodeCenterY = pos.y + NODE_H / 2;
        const preferredSide = incoming ? 'left' : 'right';
        const baseOffset = slot % 2 === 0
          ? -32 - Math.floor(slot / 2) * 56
          : 32 + Math.floor(slot / 2) * 56;
        const offsets = [baseOffset, 0, -96, 96, -160, 160, -224, 224];
        const gaps = [PORTAL_AUTO_GAP, PORTAL_AUTO_GAP + 52, PORTAL_AUTO_GAP + 104];
        const candidates = [];

        [preferredSide, preferredSide === 'left' ? 'right' : 'left'].forEach((side, sideIndex) => {
          gaps.forEach((gap, gapIndex) => {
            offsets.forEach((offset) => {
              const rawX = side === 'left' ? pos.x - PORTAL_W - gap : pos.x + NODE_W + gap;
              const rawY = nodeCenterY + offset - PORTAL_H / 2;
              const x = clamp(rawX, 16, WORLD_W - PORTAL_W - 16);
              const y = clamp(rawY, 16, WORLD_H - PORTAL_H - 16);
              candidates.push({
                x,
                y,
                score: sideIndex * 900 + gapIndex * 32 + Math.abs(offset - baseOffset) * 1.6 + (Math.abs(rawX - x) + Math.abs(rawY - y)) * 2
              });
            });
          });
        });

        const unique = Array.from(new Map(candidates.map((candidate) => [`${candidate.x}:${candidate.y}`, candidate])).values())
          .sort((a, b) => a.score - b.score);
        return unique.find((candidate) => !portalCollides(candidate, occupied)) || unique[0];
      }

      function portalGeometry(edge, source, target, sourceVisible, targetVisible, slot = 0, position = null) {
        const incoming = !sourceVisible && targetVisible;
        const visibleNode = incoming ? target : source;
        const hiddenNode = incoming ? source : target;
        const pos = ensurePosition(visibleNode);
        const nodeCenter = { x: pos.x + NODE_W / 2, y: pos.y + NODE_H / 2 };
        const offsetY = slot % 2 === 0 ? -32 - Math.floor(slot / 2) * 56 : 32 + Math.floor(slot / 2) * 56;
        const defaultPosition = incoming
          ? { x: pos.x - PORTAL_W - PORTAL_AUTO_GAP, y: nodeCenter.y + offsetY - PORTAL_H / 2 }
          : { x: pos.x + NODE_W + PORTAL_AUTO_GAP, y: nodeCenter.y + offsetY - PORTAL_H / 2 };
        const stored = edge.portalPositions?.[currentDomain];
        const requested = position || stored || defaultPosition;
        const x = clamp(requested.x, 16, WORLD_W - PORTAL_W - 16);
        const y = clamp(requested.y, 16, WORLD_H - PORTAL_H - 16);
        const pillCenter = { x: x + PORTAL_W / 2, y: y + PORTAL_H / 2 };
        const dx = pillCenter.x - nodeCenter.x;
        const dy = pillCenter.y - nodeCenter.y;
        const vertical = Math.abs(dy) > Math.abs(dx) * 1.05;
        const nodeSide = vertical ? (dy >= 0 ? 'bottom' : 'top') : (dx >= 0 ? 'right' : 'left');
        const pillSide = vertical ? (dy >= 0 ? 'top' : 'bottom') : (dx >= 0 ? 'left' : 'right');
        const nodePoint = nodePort(pos, nodeSide, incoming ? 'target' : 'source');
        const portalSpread = slot === 0 ? 0 : Math.ceil(slot / 2) * 16 * (slot % 2 ? 1 : -1);
        if (isHorizontalSide(nodeSide)) nodePoint.y = clamp(nodePoint.y + portalSpread, pos.y + 18, pos.y + NODE_H - 18);
        else nodePoint.x = clamp(nodePoint.x + portalSpread, pos.x + 24, pos.x + NODE_W - 24);
        const pillPoint = vertical
          ? { x: pillCenter.x, y: dy >= 0 ? y : y + PORTAL_H, side: pillSide }
          : { x: dx >= 0 ? x : x + PORTAL_W, y: pillCenter.y, side: pillSide };
        const geometry = incoming
          ? orthogonalPath(pillPoint, nodePoint, slot * 7)
          : orthogonalPath(nodePoint, pillPoint, slot * 7);
        return { ...geometry, x, y, incoming, visibleNode, hiddenNode };
      }

      function buildPortalRoutes() {
        if (currentDomain === 'all') return new Map();
        const portalSlots = new Map();
        const occupied = visibleNodes().map((node) => {
          const pos = ensurePosition(node);
          return { x: pos.x, y: pos.y, width: NODE_W, height: NODE_H, kind: 'node' };
        });
        const routes = new Map();

        state.edges.forEach((edge) => {
          const source = nodeById(edge.source);
          const target = nodeById(edge.target);
          if (!source || !target) return;
          const sourceVisible = isVisible(source);
          const targetVisible = isVisible(target);
          if (sourceVisible === targetVisible) return;
          const slotKey = sourceVisible ? `out:${source.id}` : `in:${target.id}`;
          const slot = portalSlots.get(slotKey) || 0;
          portalSlots.set(slotKey, slot + 1);
          const visibleNode = sourceVisible ? source : target;
          const stored = edge.portalPositions?.[currentDomain];
          const position = stored || autoPortalPosition(visibleNode, !sourceVisible && targetVisible, slot, occupied);
          const geometry = portalGeometry(edge, source, target, sourceVisible, targetVisible, slot, position);
          geometry.slot = slot;
          geometry.autoPositioned = !stored;
          routes.set(edge.id, geometry);
          occupied.push({ x: geometry.x, y: geometry.y, width: PORTAL_W, height: PORTAL_H, kind: 'portal' });
        });

        return routes;
      }

      function renderTabs() {
        $('domainTabs').innerHTML = state.domains.map((domain) => `
          <button class="domain-tab ${domain.id === currentDomain ? 'active' : ''}"
            data-domain="${domain.id}" style="--domain-color:${domain.color}">
            ${escapeHtml(domain.name)}
          </button>`).join('');
        $('domainTabs').querySelectorAll('[data-domain]').forEach((button) => {
          button.addEventListener('click', () => switchDomain(button.dataset.domain));
        });
        const last = navigationStack[navigationStack.length - 1];
        $('backBtn').classList.toggle('visible', Boolean(last));
        $('backLabel').textContent = last ? `${domainById(last.domain).name} · ${nodeById(last.selectedId)?.title || '이전 위치'}` : '이전 위치';
      }

      function renderEdges(animatePortals = true) {
        hidePortalTooltip();
        const internalRoutes = buildInternalRoutes();
        const portalRoutes = buildPortalRoutes();
        let paths = `
          <defs>
            <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,7 L8,3.5 z" fill="#4f5a54" /></marker>
            <marker id="arrowCross" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,7 L8,3.5 z" fill="#b94b37" /></marker>
          </defs>`;
        let portals = '';

        state.edges.forEach((edge) => {
          const source = nodeById(edge.source);
          const target = nodeById(edge.target);
          if (!source || !target) return;
          const sourceVisible = isVisible(source);
          const targetVisible = isVisible(target);

          if (sourceVisible && targetVisible) {
            const route = internalRoutes.get(edge.id);
            if (!route) return;
            const geometry = edgePath(route);
            const cross = !sharesDomain(source, target);
            const candidate = edge.status === '후보';
            const sourcePortCoordinate = isHorizontalSide(route.sourceSide) ? geometry.start.y : geometry.start.x;
            const targetPortCoordinate = isHorizontalSide(route.targetSide) ? geometry.end.y : geometry.end.x;
            paths += `<path class="edge-path ${cross ? 'cross' : ''} ${candidate ? 'candidate' : ''}" data-edge-id="${escapeHtml(edge.id)}" data-route-axis="${route.axis}" data-source-port="${route.sourceSide}:${sourcePortCoordinate}" data-target-port="${route.targetSide}:${targetPortCoordinate}" d="${geometry.d}" marker-end="url(#${cross ? 'arrowCross' : 'arrow'})" />`;
            paths += `<text class="edge-label" x="${geometry.labelX}" y="${geometry.labelY}" text-anchor="middle">${escapeHtml(typeLabel(edge.type))}</text>`;
          } else if (sourceVisible !== targetVisible && currentDomain !== 'all') {
            const portal = portalRoutes.get(edge.id);
            if (!portal) return;
            const slot = portal.slot;
            paths += `<path class="edge-path cross ${edge.status === '후보' ? 'candidate' : ''}" data-edge-id="${escapeHtml(edge.id)}" d="${portal.d}" marker-end="url(#arrowCross)" />`;
            const destination = portal.incoming ? source : target;
            const destinationDomain = destination.domains.find((id) => id !== currentDomain) || destination.domain;
            const label = `${domainById(destinationDomain).name} · ${edge.paper}`;
            portals += `
              <button class="portal-pill ${animatePortals ? '' : 'no-entry'} ${edge.status === '후보' ? 'candidate' : ''}" style="left:${portal.x}px;top:${portal.y}px;--portal-color:${domainColor(destinationDomain)}"
                data-edge-id="${escapeHtml(edge.id)}" data-portal-slot="${slot}" data-auto-positioned="${portal.autoPositioned}" data-portal-domain="${destinationDomain}" data-portal-node="${destination.id}"
                data-tooltip="${escapeHtml(label)}" aria-describedby="portalTooltip" aria-label="${escapeHtml(label)}. 드래그하여 위치 이동, 클릭하여 이동">
                <span class="portal-label"><b class="portal-domain">${escapeHtml(domainById(destinationDomain).name)}</b> · ${escapeHtml(edge.paper)}</span>
              </button>`;
          }
        });

        edgeLayer.innerHTML = paths;
        portalLayer.innerHTML = portals;
        portalLayer.querySelectorAll('[data-portal-node]').forEach((button) => {
          button.addEventListener('mouseenter', () => showPortalTooltip(button));
          button.addEventListener('mouseleave', () => hidePortalTooltip(button));
          button.addEventListener('focus', () => {
            if (!portalDragInfo || portalDragInfo.button !== button) showPortalTooltip(button);
          });
          button.addEventListener('blur', () => hidePortalTooltip(button));
          button.addEventListener('pointerdown', (event) => {
            hidePortalTooltip(button);
            startPortalDrag(event);
          });
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            if (button.dataset.dragged === 'true') {
              button.dataset.dragged = 'false';
              return;
            }
            navigatePortal(button.dataset.portalDomain, button.dataset.portalNode);
          });
        });
      }

      function renderNodes() {
        hidePortalTooltip();
        nodeLayer.innerHTML = visibleNodes().map((node, index) => {
          const pos = ensurePosition(node);
          const domain = domainById(nodeDisplayDomain(node));
          const firstPaper = paperTitle(node.papers?.[0]) || '연결된 논문 없음';
          const more = (node.papers?.length || 0) > 1 ? ` 외 ${node.papers.length - 1}편` : '';
          const rail = node.domains.length > 1
            ? `<span class="domain-rail" aria-label="여러 분야에 표시되는 개념">${node.domains.map((id) => `<i style="background:${domainColor(id)}"></i>`).join('')}</span>`
            : '';
          return `
            <article class="node-card ${node.id === selectedId ? 'selected' : ''} ${node.status === '후보' ? 'candidate' : ''}" tabindex="0" role="button"
              aria-label="${escapeHtml(node.title)} 개념 노드" aria-describedby="portalTooltip" aria-controls="inspector"
              aria-pressed="${node.id === selectedId}" aria-expanded="${node.id === selectedId && inspectorOpen}"
              data-node-id="${node.id}" data-tooltip="${escapeHtml(node.title)}"
              style="left:${pos.x}px;top:${pos.y}px;--domain-color:${domain.color};animation-delay:${Math.min(index * 35, 210)}ms">
              ${rail}
              ${node.status === '후보' ? '<span class="candidate-badge">후보</span>' : ''}
              <div class="node-title">${escapeHtml(node.title)}</div>
              <div class="node-summary">${escapeHtml(node.summary)}</div>
              <div class="paper-chip"><span>${escapeHtml(firstPaper + more)}</span></div>
            </article>`;
        }).join('');

        nodeLayer.querySelectorAll('[data-node-id]').forEach((card) => {
          card.addEventListener('mouseenter', () => showPortalTooltip(card));
          card.addEventListener('mouseleave', () => hidePortalTooltip(card));
          card.addEventListener('focus', () => {
            if (!dragInfo || dragInfo.card !== card) showPortalTooltip(card);
          });
          card.addEventListener('blur', () => hidePortalTooltip(card));
          card.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              selectNode(card.dataset.nodeId, { toggleInspector: true });
            }
          });
          card.addEventListener('pointerdown', (event) => {
            hidePortalTooltip(card);
            startNodeDrag(event);
          });
        });
      }

      function setInspectorOpen(open) {
        const node = selectedId ? nodeById(selectedId) : null;
        const hasSelection = Boolean(node && isVisible(node));
        inspectorOpen = Boolean(open && hasSelection);
        workspace.classList.toggle('has-selection', hasSelection);
        workspace.classList.toggle('inspector-open', inspectorOpen);
        inspector.setAttribute('aria-hidden', String(!inspectorOpen));
      }

      function renderInspector() {
        const node = selectedId ? nodeById(selectedId) : null;
        if (!node || !isVisible(node)) {
          inspector.innerHTML = '';
          setInspectorOpen(false);
          $('addEdgeBtn').disabled = false;
          return;
        }
        const incoming = state.edges.filter((edge) => edge.target === node.id).length;
        const outgoing = state.edges.filter((edge) => edge.source === node.id).length;
        inspector.style.setProperty('--selected-color', domainColor(nodeDisplayDomain(node)));
        inspector.innerHTML = `
          <div class="inspector-head"><div class="inspector-kicker">${escapeHtml(domainById(nodeDisplayDomain(node)).name)} · ${node.status === '후보' ? '후보 개념' : '승인 개념'}</div><button class="btn icon inspector-close" id="inspectorCloseBtn" aria-label="노드 정보 닫기">×</button></div>
          <h2>${escapeHtml(node.title)}</h2>
          <p class="inspector-summary">${escapeHtml(node.summary)}</p>
          <div class="section-label">표시 분야</div>
          <div class="tag-row">${node.domains.map((id) => `<span class="tag">${escapeHtml(domainById(id).name)}</span>`).join('')}</div>
          <div class="section-label">연결 논문</div>
          <div class="paper-list">${(node.papers || []).map(renderPaperItem).join('')}</div>
          <div class="section-label">관계</div>
          <div class="relation-stats"><div class="stat"><strong>${incoming}</strong><span>들어오는 관계</span></div><div class="stat"><strong>${outgoing}</strong><span>나가는 관계</span></div></div>
          <div class="inspector-actions"><button class="btn" id="focusSelectedBtn">화면 중앙</button>${notionSyncEnabled ? '<button class="btn" id="editInNotionBtn">Notion에서 편집</button>' : '<button class="btn danger" id="deleteSelectedBtn">노드 삭제</button>'}</div>`;
        $('inspectorCloseBtn').addEventListener('click', () => setInspectorOpen(false));
        $('focusSelectedBtn').addEventListener('click', () => focusNode(node.id));
        if (notionSyncEnabled) $('editInNotionBtn').addEventListener('click', () => {
          const notionUrl = safeNotionPageUrl(node.notionUrl);
          if (notionUrl) window.open(notionUrl, '_blank', 'noopener,noreferrer');
          else openNotionLibrary();
        });
        else $('deleteSelectedBtn').addEventListener('click', () => deleteSelectedNode());
        setInspectorOpen(inspectorOpen);
      }

      function render() {
        renderTabs();
        renderEdges();
        renderNodes();
        renderInspector();
        applyViewport();
        updateLayoutActionButton();
      }

      function selectNode(id, options = {}) {
        const togglingCurrentInspector = Boolean(id && id === selectedId && options.toggleInspector === true);
        selectedId = id;
        inspectorOpen = togglingCurrentInspector ? !inspectorOpen : Boolean(id && options.openInspector !== false);
        renderNodes();
        renderInspector();
      }

      function switchDomain(domainId, options = {}) {
        state.viewports[currentDomain] = { ...viewport };
        currentDomain = domainId;
        selectedId = options.selectedId || null;
        inspectorOpen = Boolean(selectedId);
        viewport = state.viewports[currentDomain] || { x: 55, y: 28, scale: .86 };
        saveState('분야 전환 저장됨');
        render();
        if (options.focusId) requestAnimationFrame(() => focusNode(options.focusId));
        else requestAnimationFrame(() => fitVisible(false));
      }

      function navigatePortal(domainId, nodeId) {
        navigationStack.push({ domain: currentDomain, viewport: { ...viewport }, selectedId: selectedId || null });
        switchDomain(domainId, { selectedId: nodeId, focusId: nodeId });
        showToast(`${domainById(domainId).name}의 ${nodeById(nodeId)?.title || '개념'}으로 이동`);
      }

      function goBack() {
        const previous = navigationStack.pop();
        if (!previous) return;
        state.viewports[currentDomain] = { ...viewport };
        currentDomain = previous.domain;
        selectedId = previous.selectedId && nodeById(previous.selectedId) ? previous.selectedId : null;
        inspectorOpen = Boolean(selectedId);
        viewport = previous.viewport;
        saveState('이전 위치 복원됨');
        render();
      }

      function focusNode(id) {
        const node = nodeById(id);
        if (!node || !isVisible(node)) return;
        const pos = ensurePosition(node);
        const rect = canvas.getBoundingClientRect();
        const targetScale = Math.min(Math.max(viewport.scale, .9), 1.12);
        viewport = {
          scale: targetScale,
          x: rect.width / 2 - (pos.x + NODE_W / 2) * targetScale,
          y: rect.height / 2 - (pos.y + NODE_H / 2) * targetScale
        };
        applyViewport();
        saveState('중심 위치 저장됨');
        selectNode(id);
      }

      function fitVisible(animate = true) {
        const nodes = visibleNodes();
        if (!nodes.length) return;
        const positions = nodes.map((node) => ensurePosition(node));
        const bounds = positions.map((p) => ({ minX: p.x, minY: p.y, maxX: p.x + NODE_W, maxY: p.y + NODE_H }));
        if (currentDomain !== 'all') {
          buildPortalRoutes().forEach((portal) => {
            bounds.push({ minX: portal.x - 12, minY: portal.y - 10, maxX: portal.x + 235, maxY: portal.y + 46 });
          });
        }
        const minX = Math.min(...bounds.map((b) => b.minX));
        const minY = Math.min(...bounds.map((b) => b.minY));
        const maxX = Math.max(...bounds.map((b) => b.maxX));
        const maxY = Math.max(...bounds.map((b) => b.maxY));
        const rect = canvas.getBoundingClientRect();
        const padding = 120;
        const scale = Math.min(1.02, Math.max(.42, Math.min((rect.width - padding) / (maxX - minX), (rect.height - padding) / (maxY - minY))));
        if (animate) world.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1)';
        viewport = {
          scale,
          x: (rect.width - (maxX - minX) * scale) / 2 - minX * scale,
          y: (rect.height - (maxY - minY) * scale) / 2 - minY * scale
        };
        applyViewport();
        saveState('화면 배치 저장됨');
        if (animate) setTimeout(() => { world.style.transition = ''; }, 380);
      }

      function startNodeDrag(event) {
        if (event.button !== 0) return;
        event.stopPropagation();
        const card = event.currentTarget;
        const node = nodeById(card.dataset.nodeId);
        if (!node) return;
        const pos = ensurePosition(node);
        dragInfo = {
          pointerId: event.pointerId,
          node,
          card,
          startX: event.clientX,
          startY: event.clientY,
          originX: pos.x,
          originY: pos.y,
          moved: false
        };
        card.setPointerCapture(event.pointerId);
      }

      function moveNode(event) {
        if (!dragInfo || dragInfo.pointerId !== event.pointerId) return;
        const screenDx = event.clientX - dragInfo.startX;
        const screenDy = event.clientY - dragInfo.startY;
        if (!dragInfo.moved) {
          if (Math.hypot(screenDx, screenDy) < NODE_DRAG_THRESHOLD) return;
          dragInfo.moved = true;
          selectedId = dragInfo.node.id;
          inspectorOpen = false;
          nodeLayer.querySelectorAll('.node-card').forEach((item) => item.classList.toggle('selected', item === dragInfo.card));
          dragInfo.card.classList.add('dragging');
          renderInspector();
        }
        const dx = screenDx / viewport.scale;
        const dy = screenDy / viewport.scale;
        const pos = ensurePosition(dragInfo.node);
        pos.x = Math.max(0, Math.min(WORLD_W - NODE_W, dragInfo.originX + dx));
        pos.y = Math.max(0, Math.min(WORLD_H - NODE_H, dragInfo.originY + dy));
        dragInfo.card.style.left = `${pos.x}px`;
        dragInfo.card.style.top = `${pos.y}px`;
        renderEdges(false);
      }

      function endNodeDrag(event) {
        if (!dragInfo || dragInfo.pointerId !== event.pointerId) return;
        const completed = dragInfo;
        completed.card.classList.remove('dragging');
        dragInfo = null;
        if (completed.moved) {
          if (recommendedLayoutUndo?.domainId === currentDomain) {
            recommendedLayoutUndo.nodeMoves += 1;
            if (recommendedLayoutUndo.nodeMoves > RECOMMENDED_LAYOUT_UNDO_MOVE_LIMIT) {
              recommendedLayoutUndo = null;
              showToast('노드를 6회 이동해 이전 배치 복원이 종료되었습니다');
            }
            updateLayoutActionButton();
          }
          saveState('노드 위치 저장됨');
          if (notionSyncEnabled) queueRemoteLayout('concept', completed.node.id, completed.node.positions);
          return;
        }
        if (event.type !== 'pointercancel') selectNode(completed.node.id, { toggleInspector: true });
      }

      function startPortalDrag(event) {
        if (event.button !== 0) return;
        event.stopPropagation();
        const button = event.currentTarget;
        const edge = state.edges.find((item) => item.id === button.dataset.edgeId);
        if (!edge) return;
        const source = nodeById(edge.source);
        const target = nodeById(edge.target);
        if (!source || !target) return;
        const sourceVisible = isVisible(source);
        const targetVisible = isVisible(target);
        if (sourceVisible === targetVisible) return;
        const slot = Number(button.dataset.portalSlot || 0);
        const portal = portalGeometry(edge, source, target, sourceVisible, targetVisible, slot);
        const displayedX = Number.parseFloat(button.style.left);
        const displayedY = Number.parseFloat(button.style.top);
        portalDragInfo = {
          pointerId: event.pointerId,
          edge,
          source,
          target,
          sourceVisible,
          targetVisible,
          slot,
          button,
          startX: event.clientX,
          startY: event.clientY,
          originX: Number.isFinite(displayedX) ? displayedX : portal.x,
          originY: Number.isFinite(displayedY) ? displayedY : portal.y,
          moved: false
        };
        button.dataset.dragged = 'false';
        button.classList.add('dragging');
        button.setPointerCapture(event.pointerId);
      }

      function movePortal(event) {
        if (!portalDragInfo || portalDragInfo.pointerId !== event.pointerId) return;
        const dx = (event.clientX - portalDragInfo.startX) / viewport.scale;
        const dy = (event.clientY - portalDragInfo.startY) / viewport.scale;
        if (Math.hypot(dx, dy) > 4) portalDragInfo.moved = true;
        if (!portalDragInfo.moved) return;
        portalDragInfo.edge.portalPositions ||= {};
        portalDragInfo.edge.portalPositions[currentDomain] = {
          x: Math.max(16, Math.min(WORLD_W - PORTAL_W - 16, portalDragInfo.originX + dx)),
          y: Math.max(16, Math.min(WORLD_H - PORTAL_H - 16, portalDragInfo.originY + dy))
        };
        const portal = portalGeometry(
          portalDragInfo.edge,
          portalDragInfo.source,
          portalDragInfo.target,
          portalDragInfo.sourceVisible,
          portalDragInfo.targetVisible,
          portalDragInfo.slot
        );
        portalDragInfo.button.style.left = `${portal.x}px`;
        portalDragInfo.button.style.top = `${portal.y}px`;
        const path = Array.from(edgeLayer.querySelectorAll('[data-edge-id]')).find((item) => item.dataset.edgeId === portalDragInfo.edge.id);
        path?.setAttribute('d', portal.d);
      }

      function endPortalDrag(event) {
        if (!portalDragInfo || portalDragInfo.pointerId !== event.pointerId) return;
        const completed = portalDragInfo;
        completed.button.classList.remove('dragging');
        completed.button.dataset.dragged = String(completed.moved);
        const moved = completed.moved;
        portalDragInfo = null;
        if (moved) {
          saveState('분야 포털 위치 저장됨');
          if (notionSyncEnabled) queueRemoteLayout('relation', completed.edge.id, completed.edge.portalPositions);
        }
      }

      function startPan(event) {
        if (event.button !== 0 || event.target.closest('.node-card, .portal-pill, .canvas-tools')) return;
        panInfo = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, originX: viewport.x, originY: viewport.y };
        canvas.classList.add('panning');
        canvas.setPointerCapture(event.pointerId);
      }

      function movePan(event) {
        if (!panInfo || panInfo.pointerId !== event.pointerId) return;
        viewport.x = panInfo.originX + event.clientX - panInfo.startX;
        viewport.y = panInfo.originY + event.clientY - panInfo.startY;
        applyViewport();
      }

      function endPan(event) {
        if (!panInfo || panInfo.pointerId !== event.pointerId) return;
        panInfo = null;
        canvas.classList.remove('panning');
        saveState('캔버스 위치 저장됨');
      }

      function zoomAt(delta, clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const px = clientX ?? rect.left + rect.width / 2;
        const py = clientY ?? rect.top + rect.height / 2;
        const localX = px - rect.left;
        const localY = py - rect.top;
        const worldX = (localX - viewport.x) / viewport.scale;
        const worldY = (localY - viewport.y) / viewport.scale;
        const nextScale = Math.min(1.6, Math.max(.38, viewport.scale * delta));
        viewport.x = localX - worldX * nextScale;
        viewport.y = localY - worldY * nextScale;
        viewport.scale = nextScale;
        applyViewport();
        saveState('확대율 저장됨');
      }

      function openModal(id) {
        $(id).classList.add('open');
        const first = $(id).querySelector('input, select, textarea');
        setTimeout(() => first?.focus(), 30);
      }

      function closeModal(id) { $(id).classList.remove('open'); }

      function populateForms() {
        const previousDomain = $('nodeDomain').value;
        const previousAdditional = new Set(selectedValues($('nodeAdditionalDomains')));
        const domainOptions = state.domains.filter((domain) => domain.id !== 'all');
        $('nodeDomain').innerHTML = `${domainOptions.map((domain) => `<option value="${domain.id}">${escapeHtml(domain.name)}</option>`).join('')}<option value="${NEW_DOMAIN_VALUE}">＋ 새 분야 추가</option>`;
        $('nodeAdditionalDomains').innerHTML = domainOptions.map((domain) => `<option value="${domain.id}">${escapeHtml(domain.name)}</option>`).join('');
        if (domainOptions.some((domain) => domain.id === previousDomain)) $('nodeDomain').value = previousDomain;
        Array.from($('nodeAdditionalDomains').options).forEach((option) => { option.selected = previousAdditional.has(option.value); });
        const options = state.nodes.map((node) => `<option value="${node.id}">${escapeHtml(node.domains.map((id) => domainById(id).name).join(' · '))} · ${escapeHtml(node.title)}</option>`).join('');
        $('edgeSource').innerHTML = options;
        $('edgeTarget').innerHTML = options;
        populatePaperOptions();
      }

      function domainSlugify(value) {
        const base = value.toLowerCase().trim().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-|-$/g, '') || 'field';
        let id = base;
        let counter = 2;
        while (state.domains.some((domain) => domain.id === id)) id = `${base}-${counter++}`;
        return id;
      }

      function addDomain(formData) {
        const name = String(formData.get('name')).trim();
        const existing = state.domains.find((domain) => domain.name.toLocaleLowerCase() === name.toLocaleLowerCase());
        if (existing) {
          showToast('이미 있는 분야를 선택했습니다');
          return existing;
        }
        const domain = {
          id: domainSlugify(name),
          name,
          color: String(formData.get('color') || DOMAIN_COLOR_PALETTE[(state.domains.length - 1) % DOMAIN_COLOR_PALETTE.length])
        };
        state.domains.push(domain);
        state.viewports[domain.id] = { x: 55, y: 28, scale: .86 };
        saveState('새 분야 저장됨');
        renderTabs();
        showToast(`${domain.name} 분야를 추가했습니다`);
        return domain;
      }

      function cancelDomainCreation() {
        closeModal('domainModal');
        $('nodeDomain').value = pendingDomainFallback;
        $('domainForm').reset();
      }

      function slugify(value) {
        const base = value.toLowerCase().trim().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-|-$/g, '') || 'concept';
        let id = base;
        let counter = 2;
        while (nodeById(id)) id = `${base}-${counter++}`;
        return id;
      }

      function addNode(formData) {
        const domain = formData.get('domain');
        if (!state.domains.some((item) => item.id === domain) || domain === 'all') {
          showToast('노드를 추가할 분야를 선택해주세요');
          return false;
        }
        const domains = [...new Set([domain, ...selectedValues($('nodeAdditionalDomains'))])];
        const papers = selectedValues($('nodePapers')).map((id) => {
          const paper = availablePapers.find((item) => item.id === id);
          return paper ? { title: paper.title, notionUrl: paper.notionUrl, notionPageId: paper.id } : null;
        }).filter(Boolean);
        const id = slugify(formData.get('title'));
        const sameDomainNodes = state.nodes.filter((node) => node.domains.includes(domain));
        const index = sameDomainNodes.length;
        state.nodes.push({
          id,
          title: String(formData.get('title')).trim(),
          summary: String(formData.get('summary')).trim(),
          domain,
          domains,
          status: '후보',
          papers,
          positions: {
            [domain]: { x: 180 + (index % 3) * 350, y: 170 + Math.floor(index / 3) * 205 },
            all: { x: 170 + (state.nodes.length % 4) * 325, y: 160 + Math.floor(state.nodes.length / 4) * 205 }
          }
        });
        saveState('새 개념 저장됨');
        populateForms();
        if (currentDomain !== domain && currentDomain !== 'all') switchDomain(domain, { selectedId: id, focusId: id });
        else { selectedId = id; inspectorOpen = true; render(); focusNode(id); }
        showToast('새 개념 노드를 추가했습니다');
        return true;
      }

      function addEdge(formData) {
        const source = formData.get('source');
        const target = formData.get('target');
        if (source === target) {
          showToast('같은 노드끼리는 연결할 수 없습니다');
          return false;
        }
        if (state.edges.some((edge) => edge.source === source && edge.target === target)) {
          showToast('이미 같은 방향의 관계가 있습니다');
          return false;
        }
        const evidence = selectedValues($('edgePapers')).map((id) => availablePapers.find((paper) => paper.id === id)).filter(Boolean);
        state.edges.push({
          id: `edge-${Date.now()}`,
          source,
          target,
          type: formData.get('type'),
          paper: evidence[0]?.title || '근거 논문 미지정',
          papers: evidence,
          status: '후보'
        });
        saveState('새 관계 저장됨');
        render();
        showToast('새 개념 관계를 추가했습니다');
        return true;
      }

      function deleteSelectedNode() {
        const node = selectedId ? nodeById(selectedId) : null;
        if (!node) return;
        if (!confirm(`“${node.title}” 노드와 연결된 관계를 삭제할까요?`)) return;
        state.nodes = state.nodes.filter((item) => item.id !== node.id);
        state.edges = state.edges.filter((edge) => edge.source !== node.id && edge.target !== node.id);
        selectedId = null;
        inspectorOpen = false;
        saveState('노드 삭제 저장됨');
        populateForms();
        render();
        showToast('노드와 연결 관계를 삭제했습니다');
      }

      function exportJson() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = `paper-roadmap-${new Date().toISOString().slice(0, 10)}.json`;
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('그래프 JSON 백업을 만들었습니다');
      }

      function recommendedLayoutRecords() {
        const nodes = visibleNodes();
        const edges = state.edges.filter((edge) => {
          const source = nodeById(edge.source);
          const target = nodeById(edge.target);
          const sourceVisible = Boolean(source && isVisible(source));
          const targetVisible = Boolean(target && isVisible(target));
          return Boolean(edge.portalPositions?.[currentDomain])
            || (currentDomain !== 'all' && sourceVisible !== targetVisible);
        });
        return { nodes, edges };
      }

      function captureLayoutBeforeRecommendation(nodes, edges) {
        return {
          domainId: currentDomain,
          nodeMoves: 0,
          viewport: { ...viewport },
          nodes: nodes.map((node) => ({
            id: node.id,
            position: node.positions?.[currentDomain] ? { ...node.positions[currentDomain] } : null
          })),
          edges: edges.map((edge) => ({
            id: edge.id,
            position: edge.portalPositions?.[currentDomain] ? { ...edge.portalPositions[currentDomain] } : null
          }))
        };
      }

      async function persistRecommendedLayout(nodes, edges) {
        let failedWrites = 0;
        if (!notionSyncEnabled) return failedWrites;
        for (const node of nodes) {
          if (!(await queueRemoteLayout('concept', node.id, node.positions))) failedWrites += 1;
        }
        for (const edge of edges) {
          if (!(await queueRemoteLayout('relation', edge.id, edge.portalPositions))) failedWrites += 1;
        }
        return failedWrites;
      }

      async function restoreRecommendedLayout() {
        const domainName = currentDomain === 'all' ? '전체' : domainById(currentDomain).name;
        if (!confirm(`${domainName} 화면을 AI 추천 배치로 되돌릴까요?\n직접 옮긴 노드와 포털 위치가 초기화됩니다.`)) return;
        if (notionSyncEnabled && (!LAYOUT_API_URL || !(await getWriteKey()))) {
          showToast('편집 키가 있어야 공유 배치를 재정렬할 수 있습니다');
          return;
        }

        const button = $('resetBtn');
        button.disabled = true;
        try {
          await layoutSaveQueue;
          const { nodes, edges } = recommendedLayoutRecords();
          recommendedLayoutUndo = captureLayoutBeforeRecommendation(nodes, edges);

          nodes.forEach((node) => {
            node.positions ||= {};
            delete node.positions[currentDomain];
          });
          edges.forEach((edge) => {
            edge.portalPositions ||= {};
            delete edge.portalPositions[currentDomain];
          });

          const domainOrder = new Map(state.domains.map((domain, index) => [domain.id, index]));
          applyAutomaticLayout(state.nodes, state.edges, currentDomain, domainOrder);
          selectedId = null;
          inspectorOpen = false;
          render();
          fitVisible(false);
          saveState('AI 추천 배치로 재정렬됨');

          if (notionSyncEnabled) {
            $('saveText').textContent = 'AI 추천 배치를 Notion에 저장 중';
          }
          const failedWrites = await persistRecommendedLayout(nodes, edges);

          if (failedWrites) {
            $('saveText').textContent = '일부 추천 위치를 저장하지 못함';
            showToast('일부 위치를 Notion에 저장하지 못했습니다');
          } else {
            $('saveText').textContent = notionSyncEnabled ? 'AI 추천 배치를 Notion에 저장함' : 'AI 추천 배치로 재정렬됨';
            showToast(`${domainName} 화면을 AI 추천 배치로 재정렬했습니다`);
          }
        } finally {
          button.disabled = false;
        }
      }

      async function restoreLayoutBeforeRecommendation() {
        const snapshot = recommendedLayoutUndo;
        if (!snapshot || snapshot.domainId !== currentDomain) {
          updateLayoutActionButton();
          return;
        }
        if (notionSyncEnabled && (!LAYOUT_API_URL || !(await getWriteKey()))) {
          showToast('편집 키가 있어야 이전 공유 배치로 돌아갈 수 있습니다');
          return;
        }

        const button = $('resetBtn');
        button.disabled = true;
        try {
          await layoutSaveQueue;
          const nodes = [];
          snapshot.nodes.forEach((record) => {
            const node = nodeById(record.id);
            if (!node) return;
            node.positions ||= {};
            if (record.position) node.positions[currentDomain] = { ...record.position };
            else delete node.positions[currentDomain];
            nodes.push(node);
          });
          const edges = [];
          snapshot.edges.forEach((record) => {
            const edge = state.edges.find((item) => item.id === record.id);
            if (!edge) return;
            edge.portalPositions ||= {};
            if (record.position) edge.portalPositions[currentDomain] = { ...record.position };
            else delete edge.portalPositions[currentDomain];
            edges.push(edge);
          });

          viewport = { ...snapshot.viewport };
          state.viewports[currentDomain] = { ...viewport };
          recommendedLayoutUndo = null;
          selectedId = null;
          inspectorOpen = false;
          render();
          saveState('AI 추천 배치 적용 전으로 돌아감');

          if (notionSyncEnabled) $('saveText').textContent = '이전 배치를 Notion에 복원 중';
          const failedWrites = await persistRecommendedLayout(nodes, edges);
          if (failedWrites) {
            $('saveText').textContent = '일부 이전 위치를 저장하지 못함';
            showToast('일부 이전 위치를 Notion에 저장하지 못했습니다');
          } else {
            $('saveText').textContent = notionSyncEnabled ? '이전 배치를 Notion에 복원함' : 'AI 추천 배치 적용 전으로 돌아감';
            showToast('AI 추천 배치 적용 전 위치로 돌아갔습니다');
          }
        } finally {
          button.disabled = false;
          updateLayoutActionButton();
        }
      }

      function handleLayoutAction() {
        return canRestoreRecommendedLayout() ? restoreLayoutBeforeRecommendation() : restoreRecommendedLayout();
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      $('addNodeBtn').addEventListener('click', () => {
        populateForms();
        const initialDomain = currentDomain !== 'all' && state.domains.some((domain) => domain.id === currentDomain) ? currentDomain : 'deep';
        pendingDomainFallback = initialDomain;
        $('nodeDomain').value = initialDomain;
        $('conceptMatchPreview').classList.remove('visible');
        if (notionSyncEnabled) loadPaperOptions();
        openModal('nodeModal');
      });
      $('addEdgeBtn').addEventListener('click', () => {
        populateForms();
        if (selectedId) $('edgeSource').value = selectedId;
        if (notionSyncEnabled) loadPaperOptions();
        openModal('edgeModal');
      });
      $('candidateToggleBtn').addEventListener('click', async () => {
        if (!notionSyncEnabled) {
          const connected = await syncFromNotion({ force: true });
          if (!connected) {
            showToast('Notion 동기화에 실패했습니다 · 잠시 후 다시 눌러주세요');
            return;
          }
        }
        if (!showCandidates && !(await getWriteKey())) return;
        showCandidates = !showCandidates;
        updateCandidateToggle();
        await syncFromNotion({ force: true });
      });
      $('exportBtn').addEventListener('click', exportJson);
      $('resetBtn').addEventListener('click', handleLayoutAction);
      $('backBtn').addEventListener('click', goBack);
      $('zoomInBtn').addEventListener('click', () => zoomAt(1.15));
      $('zoomOutBtn').addEventListener('click', () => zoomAt(1 / 1.15));
      $('fitBtn').addEventListener('click', () => fitVisible());
      inspectorPeek.addEventListener('click', () => setInspectorOpen(true));

      $('nodeDomain').addEventListener('change', (event) => {
        if (event.currentTarget.value !== NEW_DOMAIN_VALUE) {
          pendingDomainFallback = event.currentTarget.value;
          return;
        }
        $('domainName').value = '';
        $('domainColor').value = DOMAIN_COLOR_PALETTE[(state.domains.length - 1) % DOMAIN_COLOR_PALETTE.length];
        openModal('domainModal');
      });
      ['nodeTitle', 'nodeAliases', 'nodeSummary'].forEach((id) => $(id).addEventListener('change', () => previewConceptMatches()));

      $('cancelDomainBtn').addEventListener('click', cancelDomainCreation);

      $('domainForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const formData = new FormData(form);
        const domain = notionSyncEnabled ? await addRemoteDomain(formData) : addDomain(formData);
        if (!domain) return;
        closeModal('domainModal');
        form.reset();
        populateForms();
        pendingDomainFallback = domain.id;
        $('nodeDomain').value = domain.id;
      });

      $('nodeForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const formData = new FormData(form);
        const added = notionSyncEnabled ? await addRemoteNode(formData) : addNode(formData);
        if (added) {
          form.reset();
          closeModal('nodeModal');
        }
      });

      $('edgeForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const formData = new FormData(form);
        const added = notionSyncEnabled ? await addRemoteEdge(formData) : addEdge(formData);
        if (added) {
          form.reset();
          closeModal('edgeModal');
        }
      });

      document.querySelectorAll('[data-close-modal]').forEach((button) => button.addEventListener('click', () => closeModal(button.dataset.closeModal)));
      document.querySelectorAll('.modal-backdrop').forEach((modal) => modal.addEventListener('pointerdown', (event) => {
        if (event.target !== modal) return;
        if (modal.id === 'domainModal') cancelDomainCreation();
        else closeModal(modal.id);
      }));
      headerRevealZone.addEventListener('pointerenter', showHeader);
      headerRevealZone.addEventListener('click', showHeader);
      headerRevealZone.addEventListener('focus', showHeader);
      compactHeader.addEventListener('pointerenter', showHeader);
      compactHeader.addEventListener('pointerleave', scheduleHeaderHide);
      compactHeader.addEventListener('focusin', showHeader);
      compactHeader.addEventListener('focusout', (event) => {
        if (event.relatedTarget && (compactHeader.contains(event.relatedTarget) || event.relatedTarget === headerRevealZone)) return;
        scheduleHeaderHide();
      });
      document.addEventListener('pointerdown', () => { headerKeyboardNavigation = false; }, { capture: true });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Tab') headerKeyboardNavigation = true;
      }, { capture: true });
      document.addEventListener('pointermove', (event) => {
        if (event.clientY <= 12) {
          showHeader();
          return;
        }
        if (app.classList.contains('header-visible') && event.clientY > compactHeader.getBoundingClientRect().bottom + 8) scheduleHeaderHide();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if ($('domainModal').classList.contains('open')) {
            cancelDomainCreation();
            return;
          }
          const openModals = document.querySelectorAll('.modal-backdrop.open');
          if (openModals.length) openModals.forEach((modal) => closeModal(modal.id));
          else if (inspectorOpen) setInspectorOpen(false);
          else if (app.classList.contains('header-visible')) {
            setHeaderVisible(false);
            canvas.focus({ preventScroll: true });
          }
        }
      });

      canvas.addEventListener('pointerdown', startPan);
      canvas.addEventListener('pointermove', (event) => { movePortal(event); moveNode(event); movePan(event); });
      canvas.addEventListener('pointerup', (event) => { endPortalDrag(event); endNodeDrag(event); endPan(event); });
      canvas.addEventListener('pointercancel', (event) => { endPortalDrag(event); endNodeDrag(event); endPan(event); });
      canvas.addEventListener('click', (event) => { if (!event.target.closest('.node-card, .portal-pill, .canvas-tools')) selectNode(null); });
      canvas.addEventListener('wheel', (event) => { event.preventDefault(); zoomAt(event.deltaY < 0 ? 1.08 : 1 / 1.08, event.clientX, event.clientY); }, { passive: false });
      window.addEventListener('resize', () => fitVisible(false));

      populateForms();
      updateCandidateToggle();
      render();
      requestAnimationFrame(() => fitVisible(false));
      if (ROADMAP_API_URL) {
        syncFromNotion({ silent: true });
        window.setInterval(() => syncFromNotion({ silent: true }), 60_000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') syncFromNotion({ silent: true });
        });
      }
    })();
  </script>
</body>
</html>
