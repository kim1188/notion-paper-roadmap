<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>논문 아틀라스 — Notion HTML prototype</title>
  <style>
    :root {
      --paper: #f3efe5;
      --paper-deep: #eae4d6;
      --surface: #fffdf7;
      --ink: #1e2a25;
      --ink-soft: #59635d;
      --line: #c9c0ae;
      --line-strong: #918979;
      --accent: #b94b37;
      --deep: #315d80;
      --rl: #b96d32;
      --robot: #64724c;
      --medical: #8d4554;
      --shadow: 0 12px 35px rgba(48, 42, 30, .11);
      --node-w: 284px;
      --node-h: 132px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }

    body {
      min-width: 320px;
      background-image:
        radial-gradient(circle at 12% 14%, rgba(49, 93, 128, .05), transparent 30%),
        radial-gradient(circle at 88% 82%, rgba(141, 69, 84, .05), transparent 28%),
        repeating-linear-gradient(0deg, rgba(48, 42, 30, .018) 0 1px, transparent 1px 4px);
    }

    .app {
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .btn {
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: rgba(255, 253, 247, .76);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: -.01em;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .btn:hover { transform: translateY(-1px); border-color: var(--ink); background: var(--surface); }
    .btn:focus-visible { outline: 3px solid rgba(49, 93, 128, .22); outline-offset: 2px; }
    .btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
    .btn.danger { color: #8b3029; border-color: rgba(139, 48, 41, .45); }
    .btn.icon { display: inline-flex; align-items: center; justify-content: center; gap: 5px; width: 32px; padding: 0; font-size: 16px; }
    .btn.icon .layout-action-text { display: none; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .btn.icon.undo-mode { width: auto; padding: 0 9px; color: #315d80; border-color: rgba(49, 93, 128, .55); background: rgba(230, 240, 246, .9); }
    .btn.icon.undo-mode .layout-action-text { display: inline; }
    .btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .compact-header {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 46px;
      padding: 5px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 247, .92);
      backdrop-filter: blur(14px);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transform: translateY(calc(-100% - 8px));
      transition: transform .24s cubic-bezier(.2, .8, .2, 1), opacity .16s ease;
      box-shadow: 0 12px 28px rgba(47, 40, 29, .12);
    }

    .app.header-visible .compact-header {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .header-reveal-zone {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      z-index: 41;
      height: 12px;
      padding: 0;
      border: 0;
      background: transparent;
      opacity: 0;
      cursor: default;
    }

    .header-reveal-zone:focus-visible {
      height: 16px;
      opacity: 1;
      outline: 0;
      background: linear-gradient(180deg, rgba(49, 93, 128, .2), transparent);
    }

    .app.header-visible .header-reveal-zone { pointer-events: none; }

    .back-btn {
      display: none;
      align-items: center;
      gap: 6px;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .back-btn.visible { display: inline-flex; }

    .domain-tabs { display: flex; gap: 4px; min-width: max-content; }

    .domain-tab {
      --domain-color: var(--ink);
      position: relative;
      flex: 0 0 auto;
      padding: 7px 10px 7px 25px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }

    .domain-tab::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--domain-color);
      transform: translateY(-50%);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--domain-color), transparent 84%);
    }

    .domain-tab.active {
      color: var(--ink);
      background: var(--surface);
      border-color: var(--line);
      box-shadow: 0 5px 16px rgba(52, 45, 34, .07);
    }

    .header-actions {
      margin-left: auto;
      flex: 0 0 auto;
      position: sticky;
      right: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding-left: 8px;
      background: linear-gradient(90deg, rgba(255, 253, 247, 0), var(--surface) 15%);
    }

    .review-toggle {
      min-height: 28px;
      padding: 4px 8px;
      border-style: dashed;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .review-toggle.active {
      border-style: solid;
      border-color: #a77c24;
      background: #fff8df;
      color: #745817;
    }

    .workspace {
      --inspector-width: min(320px, calc(100% - 42px));
      position: absolute;
      inset: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--paper-deep);
    }

    .canvas-wrap {
      position: absolute;
      inset: 0;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      transition: right .22s cubic-bezier(.2,.8,.2,1);
    }

    .workspace.inspector-open .canvas-wrap { right: var(--inspector-width); }

    .canvas-tools {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 253, 247, .88);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 26px rgba(47, 40, 29, .1);
      transition: top .24s cubic-bezier(.2, .8, .2, 1);
    }

    .app.header-visible .canvas-tools { top: 56px; }

    .canvas-tools .btn {
      min-height: 25px;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 10px;
    }

    .canvas-tools .btn.icon { width: 25px; font-size: 13px; }

    .zoom-readout {
      min-width: 32px;
      text-align: center;
      color: var(--ink-soft);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .legend {
      position: absolute;
      left: 16px;
      bottom: 38px;
      z-index: 12;
      display: flex;
      gap: 13px;
      align-items: center;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, .86);
      color: var(--ink-soft);
      font-size: 10px;
      backdrop-filter: blur(10px);
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-line { width: 25px; height: 0; border-top: 2px solid var(--ink-soft); }
    .legend-line.portal { border-top-style: dashed; border-color: var(--accent); }

    .canvas {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background-color: var(--paper-deep);
      background-image:
        linear-gradient(rgba(95, 87, 70, .075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(95, 87, 70, .075) 1px, transparent 1px),
        linear-gradient(rgba(95, 87, 70, .032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(95, 87, 70, .032) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    }

    .canvas.panning { cursor: grabbing; }

    .world {
      position: absolute;
      width: 6720px;
      height: 3600px;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .edge-layer,
    .node-layer,
    .portal-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .edge-layer { overflow: visible; pointer-events: none; }
    .edge-path { fill: none; stroke: #4f5a54; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .72; }
    .edge-path.cross { stroke: var(--accent); stroke-dasharray: 8 7; opacity: .78; }
    .edge-label {
      fill: var(--ink-soft);
      font-size: 10px;
      font-weight: 700;
      paint-order: stroke;
      stroke: var(--paper-deep);
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .node-layer, .portal-layer { pointer-events: none; }

    .node-card {
      --domain-color: var(--deep);
      position: absolute;
      width: var(--node-w);
      height: var(--node-h);
      padding: 15px 18px 13px 21px;
      border: 1px solid #b9b09f;
      border-radius: 12px 12px 12px 4px;
      background: linear-gradient(145deg, #fffef9, #f7f2e8);
      box-shadow: 0 10px 27px rgba(47, 41, 31, .11), inset 4px 0 0 var(--domain-color);
      pointer-events: auto;
      cursor: grab;
      user-select: none;
      transition: box-shadow .18s ease, border-color .18s ease, filter .18s ease;
      animation: node-in .32s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes node-in {
      from { opacity: 0; transform: translateY(7px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .node-card:hover { border-color: var(--domain-color); box-shadow: 0 16px 34px rgba(47, 41, 31, .15), inset 4px 0 0 var(--domain-color); }
    .node-card.selected { border-color: var(--domain-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--domain-color), transparent 78%), 0 18px 40px rgba(47, 41, 31, .16), inset 4px 0 0 var(--domain-color); }
    .node-card.dragging { cursor: grabbing; filter: saturate(1.08); box-shadow: 0 23px 48px rgba(47, 41, 31, .2), inset 4px 0 0 var(--domain-color); }
    .node-card.candidate { opacity: .72; border-style: dashed; }
    .node-card:focus-visible { outline: 3px solid color-mix(in srgb, var(--domain-color), transparent 65%); outline-offset: 3px; }

    .domain-rail {
      position: absolute;
      top: -1px;
      left: 17px;
      width: 48px;
      height: 4px;
      display: flex;
      gap: 2px;
      overflow: hidden;
      border-radius: 999px;
    }

    .domain-rail i { flex: 1; min-width: 5px; border-radius: 999px; }

    .candidate-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      padding: 3px 6px;
      border: 1px solid #c89d38;
      border-radius: 999px;
      background: #fff8df;
      color: #745817;
      font-size: 8px;
      font-weight: 850;
      letter-spacing: .06em;
    }

    .edge-path.candidate { opacity: .42; stroke-dasharray: 4 5; }
    .portal-pill.candidate { opacity: .68; }

    .node-title {
      margin: 0 0 5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-family: "Iowan Old Style", "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
      font-size: 22px;
      line-height: 1.06;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .node-summary {
      min-height: 37px;
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.42;
    }

    .paper-chip {
      position: absolute;
      left: 21px;
      right: 16px;
      bottom: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: #625c50;
      font-family: "Iowan Old Style", Georgia, serif;
      font-size: 11.5px;
    }

    .paper-chip::before {
      content: "논문";
      flex: 0 0 auto;
      color: var(--domain-color);
      font-size: 8.5px;
      font-weight: 850;
      letter-spacing: .06em;
      white-space: nowrap;
      word-break: keep-all;
      writing-mode: horizontal-tb;
    }
    .paper-chip span { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    .portal-pill {
      --portal-color: var(--accent);
      position: absolute;
      width: 230px;
      max-width: 230px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px dashed var(--portal-color);
      border-radius: 999px;
      background: rgba(255, 253, 247, .96);
      box-shadow: 0 7px 20px rgba(50, 42, 30, .1);
      color: var(--ink);
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease;
      animation: portal-in .38s ease both;
    }

    .portal-label {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    @keyframes portal-in {
      from { opacity: 0; transform: translateX(-5px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .portal-pill.no-entry { animation: none; }
    .portal-pill:hover { transform: translateY(-1px); box-shadow: 0 11px 24px rgba(50, 42, 30, .14); }
    .portal-pill.dragging { cursor: grabbing; animation: none; transform: scale(1.015); box-shadow: 0 15px 32px rgba(50, 42, 30, .18); }
    .portal-pill:focus-visible { outline: 3px solid color-mix(in srgb, var(--portal-color), transparent 70%); outline-offset: 2px; }
    .portal-pill .portal-domain { color: var(--portal-color); }

    .portal-tooltip {
      position: absolute;
      z-index: 30;
      left: 0;
      top: 0;
      max-width: min(360px, calc(100% - 24px));
      padding: 8px 10px;
      border: 1px solid rgba(255, 253, 247, .18);
      border-radius: 8px;
      background: #27302b;
      box-shadow: 0 10px 28px rgba(31, 35, 32, .24);
      color: #fffdf7;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.42;
      letter-spacing: -.01em;
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: anywhere;
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      transform: translate(-50%, 4px);
      transition: opacity .14s ease, transform .14s ease, visibility 0s linear .14s;
    }

    .portal-tooltip::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      border: 6px solid transparent;
      border-top-color: #27302b;
      transform: translateX(-50%);
    }

    .portal-tooltip.below::after {
      top: auto;
      bottom: 100%;
      border-top-color: transparent;
      border-bottom-color: #27302b;
    }

    .portal-tooltip.visible {
      visibility: visible;
      opacity: 1;
      transform: translate(-50%, 0);
      transition-delay: 0s;
    }

    .inspector {
      position: absolute;
      inset: 0 0 0 auto;
      z-index: 26;
      width: var(--inspector-width);
      overflow-y: auto;
      padding: 18px 17px 28px;
      border-left: 1px solid var(--line);
      background: rgba(255, 253, 247, .96);
      box-shadow: -18px 0 44px rgba(47, 41, 31, .14);
      opacity: 0;
      transform: translateX(104%);
      pointer-events: none;
      transition: transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s ease;
    }

    .workspace.inspector-open .inspector {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .inspector-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .inspector-close {
      flex: 0 0 auto;
      margin-top: -4px;
      border-color: transparent;
      background: transparent;
      font-size: 20px;
    }

    .inspector-peek {
      position: absolute;
      top: 14px;
      right: 12px;
      z-index: 18;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(47, 41, 31, .11);
      background: rgba(255, 253, 247, .92);
      backdrop-filter: blur(10px);
      transition: top .24s cubic-bezier(.2, .8, .2, 1);
    }

    .app.header-visible .inspector-peek { top: 60px; }

    .workspace.has-selection:not(.inspector-open) .inspector-peek { display: inline-flex; }

    .inspector-kicker {
      margin-bottom: 9px;
      color: var(--selected-color, var(--deep));
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .inspector h2 {
      margin: 0;
      font-family: "Iowan Old Style", "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
      font-size: 25px;
      line-height: 1.14;
      letter-spacing: -.04em;
    }

    .inspector-summary {
      margin: 11px 0 18px;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.65;
    }

    .section-label {
      margin: 18px 0 8px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 5px 7px; border-radius: 999px; background: var(--paper); font-size: 10px; border: 1px solid var(--line); }

    .paper-list { display: grid; gap: 8px; }
    .paper-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      font-size: 11px;
      line-height: 1.4;
    }

    .paper-item-title {
      flex: 1 1 auto;
      min-width: 0;
      font-family: "Iowan Old Style", Georgia, serif;
      overflow-wrap: anywhere;
    }

    .paper-shortcut {
      flex: 0 0 auto;
      min-height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border: 1px solid color-mix(in srgb, var(--selected-color, var(--deep)), transparent 55%);
      border-radius: 7px;
      background: color-mix(in srgb, var(--selected-color, var(--deep)), transparent 92%);
      color: var(--selected-color, var(--deep));
      font-family: inherit;
      font-size: 9.5px;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .paper-shortcut:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--selected-color, var(--deep)), transparent 86%); }
    .paper-shortcut:focus-visible { outline: 3px solid color-mix(in srgb, var(--selected-color, var(--deep)), transparent 76%); outline-offset: 2px; }
    .paper-shortcut[disabled] { opacity: .42; cursor: not-allowed; transform: none; }

    .relation-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .stat { padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
    .stat strong { display: block; font-size: 17px; }
    .stat span { color: var(--ink-soft); font-size: 9px; }

    .inspector-actions { display: flex; gap: 7px; margin-top: 20px; }

    .footer {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 15;
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 12px;
      border-top: 1px solid var(--line);
      background: rgba(255, 253, 247, .82);
      color: var(--ink-soft);
      font-size: 9px;
      letter-spacing: .01em;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .save-state { display: flex; align-items: center; gap: 6px; }
    .save-dot { width: 6px; height: 6px; border-radius: 50%; background: #54865c; box-shadow: 0 0 0 3px rgba(84, 134, 92, .13); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(25, 31, 27, .45);
      backdrop-filter: blur(7px);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(480px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      padding: 22px;
      border: 1px solid #a99f8c;
      border-radius: 15px;
      background: var(--surface);
      box-shadow: 0 28px 80px rgba(25, 31, 27, .3);
      animation: modal-in .2s ease both;
    }

    @keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.985); } }

    .modal h3 {
      margin: 0 0 4px;
      font-family: "Iowan Old Style", "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
      font-size: 22px;
    }

    .modal-intro { margin: 0 0 18px; color: var(--ink-soft); font-size: 11px; line-height: 1.5; }
    .field { display: grid; gap: 6px; margin: 12px 0; }
    .field label { font-size: 10px; font-weight: 800; letter-spacing: .04em; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fffefa;
      color: var(--ink);
      outline: none;
    }

    .field textarea { min-height: 74px; resize: vertical; }
    .field select[multiple] { min-height: 92px; }
    .match-preview {
      display: none;
      padding: 9px 10px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink-soft);
      font-size: 10px;
      line-height: 1.5;
    }
    .match-preview.visible { display: block; }
    .field input[type="color"] { height: 42px; padding: 4px; cursor: pointer; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--deep); box-shadow: 0 0 0 3px rgba(49, 93, 128, .12); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 45px;
      z-index: 150;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--surface);
      font-size: 11px;
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 980px) {
      .back-btn { max-width: 120px; }
    }

    @media (max-width: 760px) {
      .btn { padding: 6px 8px; }
      .compact-header { padding: 5px 8px; }
      .back-btn span { display: none; }
      .back-btn { width: 32px; padding: 0; justify-content: center; }
      .inspector { width: min(310px, calc(100% - 34px)); }
      .legend { right: 14px; left: auto; }
      .footer > :last-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <button class="header-reveal-zone" id="headerRevealZone" type="button" aria-label="상단 메뉴 열기" aria-controls="compactHeader" aria-expanded="false"></button>
    <header class="compact-header" id="compactHeader" aria-hidden="true">
      <button class="btn back-btn" id="backBtn" aria-label="이전 로드맵으로 돌아가기">← <span id="backLabel">이전 위치</span></button>
      <nav class="domain-tabs" id="domainTabs" aria-label="분야 로드맵"></nav>
      <div class="header-actions" aria-label="그래프 편집 도구">
        <button class="btn review-toggle" id="candidateToggleBtn" type="button" aria-pressed="false" title="관리자용 후보 데이터 보기">후보 포함</button>
        <button class="btn icon primary" id="addNodeBtn" aria-label="개념 추가" title="개념 추가"><span aria-hidden="true">＋</span><span class="sr-only">개념 추가</span></button>
        <button class="btn icon" id="addEdgeBtn" aria-label="관계 추가" title="관계 추가"><span aria-hidden="true">↗</span><span class="sr-only">관계 추가</span></button>
        <button class="btn icon" id="exportBtn" aria-label="JSON 백업" title="JSON 백업"><span aria-hidden="true">↓</span><span class="sr-only">JSON 백업</span></button>
        <button class="btn icon" id="resetBtn" aria-label="AI 추천 배치로 재정렬" title="AI 추천 배치로 재정렬"><span aria-hidden="true">✦</span><span class="layout-action-text" aria-hidden="true"></span><span class="sr-only">AI 추천 배치로 재정렬</span></button>
      </div>
    </header>

    <main class="workspace">
      <section class="canvas-wrap" aria-label="논문 로드맵 캔버스">
        <div class="canvas-tools" aria-label="확대 축소">
          <button class="btn icon" id="zoomOutBtn" aria-label="축소">−</button>
          <span class="zoom-readout" id="zoomReadout">100%</span>
          <button class="btn icon" id="zoomInBtn" aria-label="확대">＋</button>
          <button class="btn" id="fitBtn">전체 맞춤</button>
        </div>
        <div class="legend" aria-label="범례">
          <span class="legend-item"><i class="legend-line"></i>분야 내부 관계</span>
          <span class="legend-item"><i class="legend-line portal"></i>다른 분야 포털</span>
        </div>
        <div class="canvas" id="canvas" tabindex="0">
          <div class="world" id="world">
            <svg class="edge-layer" id="edgeLayer" viewBox="0 0 6720 3600" aria-hidden="true"></svg>
            <div class="portal-layer" id="portalLayer"></div>
            <div class="node-layer" id="nodeLayer"></div>
          </div>
        </div>
        <div class="portal-tooltip" id="portalTooltip" role="tooltip" aria-hidden="true"></div>
      </section>

      <button class="btn inspector-peek" id="inspectorPeekBtn" aria-label="선택한 노드 정보 열기">노드 정보 <span aria-hidden="true">‹</span></button>
      <aside class="inspector" id="inspector" aria-live="polite" aria-hidden="true"></aside>
    </main>

    <footer class="footer">
      <div class="save-state"><i class="save-dot"></i><span id="saveText">이 브라우저에 자동 저장됨</span></div>
      <span>캔버스 드래그 · 휠 확대 · 노드 선택/이동</span>
    </footer>
  </div>

  <div class="modal-backdrop" id="nodeModal" role="dialog" aria-modal="true" aria-labelledby="nodeModalTitle">
    <form class="modal" id="nodeForm">

      <div class="field"><label for="nodeAliases">별칭·약어</label><input id="nodeAliases" name="aliases" maxlength="240" placeholder="쉼표로 구분 · 예: VLP, 시각-언어 사전학습" /></div>
      <div class="field"><label for="nodeSummary">설명</label><textarea id="nodeSummary" name="summary" required maxlength="260" placeholder="핵심 의미를 두 문장 이내로 적어주세요."></textarea></div>

  <div class="modal-backdrop" id="edgeModal" role="dialog" aria-modal="true" aria-labelledby="edgeModalTitle">
    <form class="modal" id="edgeForm">
      <h3 id="edgeModalTitle">개념 관계 추가</h3>
      <p class="modal-intro">서로 다른 분야를 연결하면 각 분야 View에서 클릭 가능한 점선 포털로 표시됩니다.</p>
      <div class="field"><label for="edgeSource">출발 개념</label><select id="edgeSource" name="source"></select></div>
      <div class="field"><label for="edgeTarget">도착 개념</label><select id="edgeTarget" name="target"></select></div>
      <div class="field"><label for="edgeType">관계</label><select id="edgeType" name="type"><option value="prerequisite">선수 개념</option><option value="extends">확장</option><option value="enables">가능하게 함</option><option value="applies_to">다른 분야에 적용</option><option value="contrasts_with">대조</option></select></div>
      <div class="field"><label for="edgePapers">근거 논문</label><select id="edgePapers" name="evidencePaperIds" multiple required></select></div>
      <div class="field"><label for="edgeSummary">관계 설명</label><textarea id="edgeSummary" name="summary" required maxlength="600" placeholder="왜 이 방향으로 연결되는지 적어주세요."></textarea></div>

  </div>

  <div class="modal-backdrop" id="domainModal" role="dialog" aria-modal="true" aria-labelledby="domainModalTitle">
    <form class="modal" id="domainForm">
      <h3 id="domainModalTitle">새 분야 추가</h3>
      <p class="modal-intro">추가한 분야는 즉시 상단 로드맵 탭과 개념 노드의 분야 목록에 반영됩니다.</p>
      <div class="field"><label for="domainName">분야 이름</label><input id="domainName" name="name" required maxlength="40" placeholder="예: 생성형 AI" /></div>
      <div class="field"><label for="domainColor">분야 색상</label><input id="domainColor" name="color" type="color" value="#6f5b8f" /></div>
      <div class="modal-actions"><button type="button" class="btn" id="cancelDomainBtn">취소</button><button class="btn primary" type="submit">분야 추가</button></div>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'notion-paper-roadmap-prototype-v1';
      const explicitApiUrl = new URLSearchParams(window.location.search).get('api');
      const ROADMAP_API_URL = explicitApiUrl || (/^https?:$/.test(window.location.protocol) ? new URL('/api/roadmap', window.location.href).href : '');
      const siblingApiUrl = (name) => ROADMAP_API_URL ? new URL(ROADMAP_API_URL.replace(/\/roadmap(?:\?.*)?$/, `/${name}`)).href : '';
      const DOMAIN_API_URL = siblingApiUrl('domains');
      const PAPER_API_URL = siblingApiUrl('papers');
      const CONCEPT_API_URL = siblingApiUrl('concepts');
      const CONCEPT_MATCH_API_URL = siblingApiUrl('concepts/match');
      const RELATION_API_URL = siblingApiUrl('relations');
      const LAYOUT_API_URL = siblingApiUrl('layout');
      const NODE_W = 284;
      const NODE_H = 132;
      const PORTAL_W = 230;
      const PORTAL_H = 36;
      const PORTAL_AUTO_GAP = 116;
      const PORT_ROLE_OFFSET = 18;
      const NODE_DRAG_THRESHOLD = 6;
      const RECOMMENDED_LAYOUT_UNDO_MOVE_LIMIT = 5;
      const WORLD_W = 6720;
      const WORLD_H = 3600;
      const CANVAS_LAYOUT_VERSION = 2;
      const AUTO_LAYOUT_PADDING_X = 480;
      const AUTO_LAYOUT_PADDING_Y = 360;

      const NEW_DOMAIN_VALUE = '__new_domain__';
      const DEFAULT_DOMAINS = [
        { id: 'all', name: '전체', color: '#2f3934' },
        { id: 'deep', name: 'AI 딥러닝', color: '#315d80' },
        { id: 'rl', name: '강화학습', color: '#b96d32' },
        { id: 'robot', name: '로봇', color: '#64724c' },
        { id: 'medical', name: '의료 AI', color: '#8d4554' }
      ];
      const DOMAIN_COLOR_PALETTE = ['#6f5b8f', '#3f7d6b', '#a65d42', '#4f6f9a', '#86684b', '#7a5269'];

      const seedState = () => ({
        domains: DEFAULT_DOMAINS.map((domain) => ({ ...domain })),
        nodes: [
          {
            id: 'transformer', title: 'Transformer', domain: 'deep', domains: ['deep'],
            summary: 'Attention을 중심으로 순차 의존 없이 토큰 간 관계를 학습하는 기반 구조.',
            papers: ['Attention Is All You Need'],
            positions: { deep: { x: 120, y: 235 }, all: { x: 90, y: 115 } }
          },
          {
            id: 'vit', title: 'Vision Transformer', domain: 'deep', domains: ['deep'],
            summary: '이미지를 패치 시퀀스로 바꾸어 Transformer로 처리하는 비전 모델.',
            papers: ['An Image is Worth 16×16 Words'],
            positions: { deep: { x: 475, y: 190 }, all: { x: 395, y: 105 } }
          },
          {
            id: 'multimodal', title: 'Multimodal Foundation Model', domain: 'deep', domains: ['deep'],
            summary: '언어·이미지 등 서로 다른 모달리티를 하나의 표현 공간에서 결합한다.',
            papers: ['Flamingo: a Visual Language Model for Few-Shot Learning'],
            positions: { deep: { x: 830, y: 245 }, all: { x: 700, y: 130 } }
          },
          {
            id: 'mdp', title: 'Markov Decision Process', domain: 'rl', domains: ['rl'],
            summary: '상태·행동·전이·보상으로 순차적 의사결정 문제를 표현하는 기본 틀.',
            papers: ['A Survey of Reinforcement Learning'],
            positions: { rl: { x: 120, y: 235 }, all: { x: 90, y: 545 } }
          },
          {
            id: 'policy-gradient', title: 'Policy Gradient', domain: 'rl', domains: ['rl'],
            summary: '정책을 직접 매개변수화하고 기대 보상의 기울기를 따라 최적화한다.',
            papers: ['Policy Gradient Methods for Reinforcement Learning with Function Approximation'],
            positions: { rl: { x: 475, y: 190 }, all: { x: 395, y: 520 } }
          },
          {
            id: 'actor-critic', title: 'Actor–Critic', domain: 'rl', domains: ['rl'],
            summary: '정책을 갱신하는 Actor와 가치를 추정하는 Critic을 함께 학습한다.',
            papers: ['Asynchronous Methods for Deep Reinforcement Learning'],
            positions: { rl: { x: 830, y: 245 }, all: { x: 700, y: 545 } }
          },
          {
            id: 'robot-policy', title: 'Robot Policy Learning', domain: 'robot', domains: ['robot'],
            summary: '감각 입력에서 로봇 행동 정책을 학습해 실제 환경의 조작을 수행한다.',
            papers: ['Learning Hand-Eye Coordination for Robotic Grasping with Deep Learning and Large-Scale Data Collection'],
            positions: { robot: { x: 330, y: 210 }, all: { x: 1030, y: 500 } }
          },
          {
            id: 'sim2real', title: 'Sim-to-Real Transfer', domain: 'robot', domains: ['robot'],
            summary: '시뮬레이션에서 배운 정책을 현실의 차이와 불확실성에 견디게 이전한다.',
            papers: ['Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World'],
            positions: { robot: { x: 720, y: 245 }, all: { x: 1335, y: 545 } }
          },
          {
            id: 'medical-vlm', title: 'Medical Vision–Language Model', domain: 'medical', domains: ['medical'],
            summary: '의료 이미지와 임상 언어를 함께 이해해 일반화된 의료 AI 과제를 다룬다.',
            papers: ['Towards Generalist Biomedical AI'],
            positions: { medical: { x: 390, y: 205 }, all: { x: 1030, y: 115 } }
          },
          {
            id: 'clinical-llm', title: 'Clinical Decision Support', domain: 'medical', domains: ['medical'],
            summary: '근거와 한계를 드러내며 의료진의 판단을 보조하는 임상 언어 모델 활용.',
            papers: ['Large Language Models Encode Clinical Knowledge'],
            positions: { medical: { x: 785, y: 245 }, all: { x: 1335, y: 145 } }
          }
        ],
        edges: [
          { id: 'e1', source: 'transformer', target: 'vit', type: 'extends', paper: 'An Image is Worth 16×16 Words' },
          { id: 'e2', source: 'vit', target: 'multimodal', type: 'enables', paper: 'Flamingo' },
          { id: 'e3', source: 'multimodal', target: 'medical-vlm', type: 'applies_to', paper: 'Towards Generalist Biomedical AI' },
          { id: 'e4', source: 'medical-vlm', target: 'clinical-llm', type: 'enables', paper: 'Large Language Models Encode Clinical Knowledge' },
          { id: 'e5', source: 'mdp', target: 'policy-gradient', type: 'prerequisite', paper: 'A Survey of Reinforcement Learning' },
          { id: 'e6', source: 'policy-gradient', target: 'actor-critic', type: 'extends', paper: 'Asynchronous Methods for Deep Reinforcement Learning' },
          { id: 'e7', source: 'actor-critic', target: 'robot-policy', type: 'applies_to', paper: 'Learning Hand-Eye Coordination for Robotic Grasping' },
          { id: 'e8', source: 'robot-policy', target: 'sim2real', type: 'enables', paper: 'Domain Randomization' },
          { id: 'e9', source: 'multimodal', target: 'robot-policy', type: 'applies_to', paper: 'PaLM-E: An Embodied Multimodal Language Model' }
        ],
        viewports: {},
        currentDomain: 'deep'
      });

      const $ = (id) => document.getElementById(id);
      const canvas = $('canvas');
      const world = $('world');
      const edgeLayer = $('edgeLayer');
      const nodeLayer = $('nodeLayer');
      const portalLayer = $('portalLayer');
      const portalTooltip = $('portalTooltip');
      const canvasWrap = document.querySelector('.canvas-wrap');
      const workspace = document.querySelector('.workspace');
      const app = document.querySelector('.app');
      const compactHeader = $('compactHeader');
      const headerRevealZone = $('headerRevealZone');
      const inspector = $('inspector');
      const inspectorPeek = $('inspectorPeekBtn');
      const toast = $('toast');

      let state = loadState();
      let currentDomain = state.domains.some((domain) => domain.id === state.currentDomain) ? state.currentDomain : 'deep';
      let selectedId = null;
      let inspectorOpen = false;
      let viewport = state.viewports[currentDomain] || { x: 60, y: 20, scale: .86 };
      let navigationStack = [];
      let dragInfo = null;
      let portalDragInfo = null;
      let portalTooltipOwner = null;
      let panInfo = null;
      let headerHideTimer = null;
      let headerKeyboardNavigation = false;
      let toastTimer = null;
      let pendingDomainFallback = 'deep';
      let notionSyncEnabled = false;
      let notionDatabaseUrl = '';
      let notionSyncInFlight = null;
      let showCandidates = false;
      let availablePapers = [];
      let recommendedLayoutUndo = null;
      let layoutSaveQueue = Promise.resolve(true);
      const edgeAxisCache = new Map();

      function cloneSeed() {
        const cloned = JSON.parse(JSON.stringify(seedState()));
        normalizeNodePapers(cloned.nodes);
        return migrateCanvasLayout(cloned);
      }

      function migrateCanvasLayout(saved) {
        if ((Number(saved?.canvasLayoutVersion) || 1) >= CANVAS_LAYOUT_VERSION) return saved;
        const domainIds = new Set();
        (saved.nodes || []).forEach((node) => Object.keys(node.positions || {}).forEach((domainId) => domainIds.add(domainId)));
        domainIds.forEach((domainId) => {
          const positioned = (saved.nodes || []).filter((node) => Number.isFinite(node.positions?.[domainId]?.x) && Number.isFinite(node.positions?.[domainId]?.y));
          if (!positioned.length) return;
          const minX = Math.min(...positioned.map((node) => node.positions[domainId].x));
          const minY = Math.min(...positioned.map((node) => node.positions[domainId].y));
          const maxX = Math.max(...positioned.map((node) => node.positions[domainId].x + NODE_W));
          const maxY = Math.max(...positioned.map((node) => node.positions[domainId].y + NODE_H));
          const dx = WORLD_W / 2 - (minX + maxX) / 2;
          const dy = WORLD_H / 2 - (minY + maxY) / 2;
          positioned.forEach((node) => {
            node.positions[domainId].x = Math.round(node.positions[domainId].x + dx);
            node.positions[domainId].y = Math.round(node.positions[domainId].y + dy);
          });
          (saved.edges || []).forEach((edge) => {
            const portal = edge.portalPositions?.[domainId];
            if (!Number.isFinite(portal?.x) || !Number.isFinite(portal?.y)) return;
            portal.x = Math.round(portal.x + dx);
            portal.y = Math.round(portal.y + dy);
          });
        });
        saved.canvasLayoutVersion = CANVAS_LAYOUT_VERSION;
        saved.viewports = {};
        return saved;
      }

      function safeNotionPageUrl(value) {
        const raw = String(value || '').trim();
        if (!raw) return '';
        try {
          const url = new URL(raw);
          const host = url.hostname.toLowerCase();
          const isNotionHost = host === 'notion.so' || host.endsWith('.notion.so') || host === 'notion.site' || host.endsWith('.notion.site') || host === 'app.notion.com';
          return url.protocol === 'https:' && isNotionHost ? url.href : '';
        } catch (_) {
          return '';
        }
      }

      function normalizePaperRecord(paper) {
        if (typeof paper === 'string') return { title: paper.trim(), notionUrl: '', notionPageId: '' };
        return {
          title: String(paper?.title || '').trim(),
          notionUrl: safeNotionPageUrl(paper?.notionUrl || paper?.url),
          notionPageId: String(paper?.notionPageId || paper?.pageId || '').trim()
        };
      }

      function normalizeNodePapers(nodes = []) {
        nodes.forEach((node) => {
          node.papers = (Array.isArray(node.papers) ? node.papers : []).map(normalizePaperRecord).filter((paper) => paper.title);
        });
        return nodes;
      }

      function paperTitle(paper) { return normalizePaperRecord(paper).title; }
      function paperNotionUrl(paper) { return normalizePaperRecord(paper).notionUrl; }

      function renderPaperItem(paper) {
        const title = paperTitle(paper);
        const notionUrl = paperNotionUrl(paper);
        const shortcut = notionUrl
          ? `<a class="paper-shortcut" href="${escapeHtml(notionUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(title)} 노션 페이지 바로가기">바로가기</a>`
          : `<button class="paper-shortcut" type="button" disabled title="노션 DB 페이지가 연결되면 활성화됩니다">바로가기</button>`;
        return `<div class="paper-item"><span class="paper-item-title">${escapeHtml(title)}</span>${shortcut}</div>`;
      }

      function normalizeDomains(savedDomains, nodes = [], includeDefaults = true) {
        const merged = new Map(includeDefaults ? DEFAULT_DOMAINS.map((domain) => [domain.id, { ...domain }]) : []);
        if (Array.isArray(savedDomains)) {
          savedDomains.forEach((domain) => {
            if (!domain?.id || !domain?.name) return;
            merged.set(domain.id, { id: domain.id, name: domain.name, color: domain.color || DOMAIN_COLOR_PALETTE[merged.size % DOMAIN_COLOR_PALETTE.length] });
          });
        }
        nodes.forEach((node) => {
          const ids = Array.isArray(node.domains) ? node.domains : [node.domain];
          ids.filter(Boolean).forEach((id) => {
            if (!merged.has(id)) merged.set(id, { id, name: id, color: DOMAIN_COLOR_PALETTE[merged.size % DOMAIN_COLOR_PALETTE.length] });
          });
        });
        return Array.from(merged.values());
      }

      function loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) return cloneSeed();
          const parsed = JSON.parse(stored);
          if (!Array.isArray(parsed.nodes) || !Array.isArray(parsed.edges)) return cloneSeed();
          normalizeNodePapers(parsed.nodes);
          parsed.domains = normalizeDomains(parsed.domains, parsed.nodes);
          parsed.viewports ||= {};
          return migrateCanvasLayout(parsed);
        } catch (_) {
          return cloneSeed();
        }
      }
